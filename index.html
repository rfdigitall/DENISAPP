function MaterialiPage({ materiali, setMateriali, materialiLoading }) {
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newUnita, setNewUnita] = useState('m');
  const [newPrezzo, setNewPrezzo] = useState('');
  const [savedFlashId, setSavedFlashId] = useState(null);
  const [salvandoNuovo, setSalvandoNuovo] = useState(false);
  const [erroreNuovo, setErroreNuovo] = useState('');

  const oggi = () => {
    const d = new Date();
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const startEdit = (m) => {
    setEditingId(m.id);
    setEditValue(String(m.prezzo).replace('.', ','));
  };

  const confirmEdit = async (id) => {
    const val = parseFloat(editValue.replace(',', '.'));
    setEditingId(null);
    if (isNaN(val) || val <= 0) return;
    const { error } = await sb.from('materiali')
      .update({ prezzo: val, ultimo_aggiornamento: new Date().toISOString() })
      .eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare il prezzo: ' + error.message);
      return;
    }
    setMateriali(materiali.map(m => m.id === id ? { ...m, prezzo: val, ultimoAggiornamento: oggi() } : m));
    setSavedFlashId(id);
    setTimeout(() => setSavedFlashId(null), 1800);
  };

  const startRename = (m) => {
    setRenamingId(m.id);
    setRenameValue(m.nome);
  };

  const confirmRename = async (id) => {
    const nome = renameValue.trim();
    setRenamingId(null);
    const originale = materiali.find(m => m.id === id)?.nome;
    if (!nome || nome === originale) return;
    const { error } = await sb.from('materiali').update({ nome }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare il nome: ' + error.message);
      return;
    }
    setMateriali(materiali.map(m => m.id === id ? { ...m, nome } : m));
  };

  const aggiornaZonaMateriale = async (id, zona) => {
    const { error } = await sb.from('materiali').update({ zona: zona || null }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare la zona: ' + error.message);
      return;
    }
    setMateriali(materiali.map(m => m.id === id ? { ...m, zona } : m));
  };

  const deleteMateriale = async (id) => {
    const { error } = await sb.from('materiali').delete().eq('id', id);
    if (error) {
      mostraToast('Errore nell’eliminare il materiale: ' + error.message);
      return;
    }
    setMateriali(materiali.filter(m => m.id !== id));
  };

  const addMateriale = async () => {
    if (!newNome.trim()) return;
    setSalvandoNuovo(true);
    setErroreNuovo('');
    const prezzo = parseFloat((newPrezzo || '0').replace(',', '.')) || 0;
    const { data, error } = await sb.from('materiali')
      .insert(materialeToRow({ nome: newNome.trim(), unita: newUnita, prezzo }))
      .select().single();
    setSalvandoNuovo(false);
    if (error) {
      setErroreNuovo('Errore nel salvare il materiale: ' + error.message);
      return;
    }
    setMateriali([materialeFromRow(data), ...materiali]);
    setNewNome('');
    setNewUnita('m');
    setNewPrezzo('');
    setShowNewForm(false);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">

      <div className="app-card overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 className="text-sm font-semibold text-slate-900">Materiali grezzi</h2>
            <p className="text-xs text-slate-400 mt-0.5">{materiali.length} voci nel listino</p>
          </div>
          <button
            onClick={() => setShowNewForm(!showNewForm)}
            className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors"
          >
            <Plus className="w-3.5 h-3.5" />
            Nuovo materiale
          </button>
        </div>

        {showNewForm && (
          <div className="px-5 py-4 bg-slate-50 border-b border-slate-100">
            <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto_auto_auto] gap-2.5 items-end">
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Nome materiale</label>
                <input
                  type="text"
                  value={newNome}
                  onChange={(e) => setNewNome(e.target.value)}
                  placeholder="Es. Tubo in rame 14mm"
                  className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Unità</label>
                <select
                  value={newUnita}
                  onChange={(e) => setNewUnita(e.target.value)}
                  className="px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                >
                  <option value="m">al metro (m)</option>
                  <option value="pz">a pezzo (pz)</option>
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo €</label>
                <input
                  type="text"
                  inputMode="decimal"
                  value={newPrezzo}
                  onChange={(e) => setNewPrezzo(e.target.value)}
                  placeholder="0,00"
                  className="w-24 px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div className="flex gap-2">
                <button
                  onClick={addMateriale}
                  disabled={salvandoNuovo}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60"
                >
                  {salvandoNuovo ? 'Salvo...' : 'Aggiungi'}
                </button>
                <button
                  onClick={() => setShowNewForm(false)}
                  className="px-3 py-2 text-slate-400 hover:text-slate-600"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            </div>
            {erroreNuovo && <p className="text-[11px] text-red-500 mt-2">{erroreNuovo}</p>}
          </div>
        )}

        {/* lista a card — su telefono una tabella non si sente mai come
            un'app nativa, meglio righe verticali con tocchi larghi */}
        <div className="lg:hidden divide-y divide-slate-50">
          {materiali.map((m) => (
            <div key={m.id} className="px-4 py-3.5 flex items-start justify-between gap-3">
              <div className="min-w-0 flex-1">
                {renamingId === m.id ? (
                  <div className="flex items-center gap-1.5">
                    <input
                      autoFocus
                      type="text"
                      value={renameValue}
                      onChange={(e) => setRenameValue(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && confirmRename(m.id)}
                      onBlur={() => confirmRename(m.id)}
                      className="w-full px-2 py-1.5 text-sm bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                    />
                    <button onClick={() => confirmRename(m.id)} className="text-emerald-600 hover:text-emerald-700 shrink-0 p-1">
                      <Check className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button onClick={() => startRename(m)} className="text-left text-sm font-medium text-slate-900 truncate block w-full py-1 -my-1">
                    {m.nome}
                  </button>
                )}
                <p className="text-xs text-slate-400 font-mono mt-1">
                  {m.unita}{m.ultimoAggiornamento ? ` · ${m.ultimoAggiornamento}` : ''}
                </p>
                <select
                  value={m.zona || ''}
                  onChange={(e) => aggiornaZonaMateriale(m.id, e.target.value)}
                  className="mt-2 w-full text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-md px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500/30"
                >
                  <option value="">Tutte le zone</option>
                  {ZONE_AMBIENTI.map(z => <option key={z.id} value={z.id}>{z.nome}</option>)}
                </select>
              </div>
              <div className="flex flex-col items-end gap-2 shrink-0">
                {editingId === m.id ? (
                  <div className="flex items-center gap-1.5">
                    <span className="text-slate-400 text-xs">€</span>
                    <input
                      autoFocus
                      type="text"
                      inputMode="decimal"
                      value={editValue}
                      onChange={(e) => setEditValue(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && confirmEdit(m.id)}
                      className="w-16 px-2 py-1.5 text-sm text-right bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                    />
                    <button onClick={() => confirmEdit(m.id)} className="text-emerald-600 hover:text-emerald-700 p-1">
                      <Check className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => startEdit(m)}
                    className={`font-semibold text-sm rounded-md px-2.5 py-1.5 transition-colors ${
                      savedFlashId === m.id ? 'bg-emerald-50 text-emerald-700' : 'text-slate-900 bg-slate-50'
                    }`}
                  >
                    {m.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €
                  </button>
                )}
                <button onClick={() => deleteMateriale(m.id)} className="w-9 h-9 flex items-center justify-center text-slate-400 hover:text-red-500">
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
            </div>
          ))}
          {materiali.length === 0 && (
            <p className="px-5 py-10 text-center text-sm text-slate-400">
              {materialiLoading ? 'Caricamento materiali...' : 'Nessun materiale ancora. Aggiungine uno per iniziare il tuo listino.'}
            </p>
          )}
        </div>

        <div className="hidden lg:block overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-100">
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Materiale</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Unità</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden md:table-cell">Zona</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Aggiornato</th>
                <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Prezzo</th>
                <th className="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {materiali.map((m) => (
                <tr key={m.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors">
                  <td className="px-5 py-3.5 font-medium text-slate-900">
                    {renamingId === m.id ? (
                      <div className="flex items-center gap-1.5">
                        <input
                          autoFocus
                          type="text"
                          value={renameValue}
                          onChange={(e) => setRenameValue(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && confirmRename(m.id)}
                          onBlur={() => confirmRename(m.id)}
                          className="w-full min-w-[10rem] px-2 py-1 text-sm bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                        />
                        <button onClick={() => confirmRename(m.id)} className="text-emerald-600 hover:text-emerald-700 shrink-0">
                          <Check className="w-4 h-4" />
                        </button>
                      </div>
                    ) : (
                      <button onClick={() => startRename(m)} className="text-left hover:text-blue-600 transition-colors">
                        {m.nome}
                      </button>
                    )}
                  </td>
                  <td className="px-5 py-3.5 text-slate-500 font-mono text-xs">{m.unita}</td>
                  <td className="px-5 py-3.5 hidden md:table-cell">
                    <select
                      value={m.zona || ''}
                      onChange={(e) => aggiornaZonaMateriale(m.id, e.target.value)}
                      className="text-xs text-slate-500 bg-transparent border border-slate-200 rounded-md px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500/30"
                    >
                      <option value="">Tutte le zone</option>
                      {ZONE_AMBIENTI.map(z => <option key={z.id} value={z.id}>{z.nome}</option>)}
                    </select>
                  </td>
                  <td className="px-5 py-3.5 text-slate-400 text-xs hidden sm:table-cell">{m.ultimoAggiornamento}</td>
                  <td className="px-5 py-3.5 text-right">
                    {editingId === m.id ? (
                      <div className="flex items-center justify-end gap-1.5">
                        <span className="text-slate-400 text-xs">€</span>
                        <input
                          autoFocus
                          type="text"
                          inputMode="decimal"
                          value={editValue}
                          onChange={(e) => setEditValue(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && confirmEdit(m.id)}
                          className="w-20 px-2 py-1 text-sm text-right bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                        />
                        <button onClick={() => confirmEdit(m.id)} className="text-emerald-600 hover:text-emerald-700">
                          <Check className="w-4 h-4" />
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => startEdit(m)}
                        className={`font-semibold transition-colors rounded-md px-2 py-1 ${
                          savedFlashId === m.id ? 'bg-emerald-50 text-emerald-700' : 'text-slate-900 hover:bg-slate-100'
                        }`}
                      >
                        {m.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €
                      </button>
                    )}
                  </td>
                  <td className="px-5 py-3.5 text-right">
                    <div className="flex items-center justify-end gap-1">
                      <button onClick={() => startEdit(m)} className="text-slate-400 hover:text-slate-600 p-1">
                        <Pencil className="w-3.5 h-3.5" />
                      </button>
                      <button onClick={() => deleteMateriale(m.id)} className="text-slate-400 hover:text-red-500 p-1">
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
              {materiali.length === 0 && (
                <tr>
                  <td colSpan="6" className="px-5 py-10 text-center text-sm text-slate-400">
                    {materialiLoading ? 'Caricamento materiali...' : 'Nessun materiale ancora. Aggiungine uno per iniziare il tuo listino.'}
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============================================================ */
/* PAGINA CATALOGO PRODOTTI — finiture premium, organizzate       */
/* ============================================================ */

function CatalogoPage({ prodotti, setProdotti, prodottiLoading }) {
  const [activeCat, setActiveCat] = useState(categorieCatalogo[0]);
  const [activeSub, setActiveSub] = useState('Tutte');
  const [activeFornitoreFiltro, setActiveFornitoreFiltro] = useState('Tutti');
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newFornitore, setNewFornitore] = useState('');
  const [newSub, setNewSub] = useState('');
  const [newTier, setNewTier] = useState('Standard');
  const [newPrezzo, setNewPrezzo] = useState('');
  const [newCodice, setNewCodice] = useState('');
  const [newDescrizione, setNewDescrizione] = useState('');
  const [newLunghezza, setNewLunghezza] = useState('');
  const [newProfondita, setNewProfondita] = useState('');
  const [newAltezza, setNewAltezza] = useState('');
  const [newSchedaUrl, setNewSchedaUrl] = useState('');
  const [newFotoFile, setNewFotoFile] = useState(null);
  const [importMsg, setImportMsg] = useState(null); // { tipo, testo }
  const [importing, setImporting] = useState(false);
  const [salvandoNuovo, setSalvandoNuovo] = useState(false);
  const [erroreNuovo, setErroreNuovo] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editPrezzo, setEditPrezzo] = useState('');
  const [caricandoFotoId, setCaricandoFotoId] = useState(null);

  const prodottiCategoria = prodotti.filter(p => p.categoria === activeCat && (activeFornitoreFiltro === 'Tutti' || p.fornitore === activeFornitoreFiltro));
  const sottocategorie = ['Tutte', ...new Set(prodottiCategoria.map(p => p.sottocategoria).filter(Boolean))];
  const filtered = prodottiCategoria.filter(p => activeSub === 'Tutte' || p.sottocategoria === activeSub);

  const fornitoreForm = newFornitore || fornitoreDiCategoria(activeCat) || FORNITORI_CATALOGO[0];
  const sottocategorieStruttura = CATALOGO_STRUTTURA[fornitoreForm]?.[activeCat] || [];

  const addProdotto = async () => {
    if (!newNome.trim()) return;
    const lunghezza = parseFloat((newLunghezza || '').replace(',', '.'));
    const profondita = parseFloat((newProfondita || '').replace(',', '.'));
    const altezza = parseFloat((newAltezza || '').replace(',', '.'));
    if (!lunghezza || !profondita || !altezza) {
      setErroreNuovo('Inserisci tutte le misure: lunghezza, profondità e altezza.');
      return;
    }
    setSalvandoNuovo(true);
    setErroreNuovo('');
    const prezzo = parseFloat((newPrezzo || '0').replace(',', '.')) || 0;
    const payload = {
      nome: newNome.trim(), categoria: activeCat, sottocategoria: newSub.trim() || 'Generico',
      tier: newTier, prezzo, fornitore: fornitoreForm, codice: newCodice.trim(),
      descrizione: newDescrizione.trim(), misuraLunghezza: lunghezza, misuraProfondita: profondita,
      misuraAltezza: altezza, schedaTecnicaUrl: newSchedaUrl.trim(),
    };
    const { data, error } = await sb.from('prodotti').insert(prodottoToRow(payload)).select().single();
    if (error) {
      setSalvandoNuovo(false);
      setErroreNuovo('Errore nel salvare il prodotto: ' + error.message);
      return;
    }
    const nuovoProdotto = prodottoFromRow(data);
    setProdotti(prev => [nuovoProdotto, ...prev]);
    if (newFotoFile) await cambiaFotoProdotto(nuovoProdotto, newFotoFile);
    setSalvandoNuovo(false);
    setNewNome('');
    setNewFornitore('');
    setNewSub('');
    setNewTier('Standard');
    setNewPrezzo('');
    setNewCodice('');
    setNewDescrizione('');
    setNewLunghezza('');
    setNewProfondita('');
    setNewAltezza('');
    setNewSchedaUrl('');
    setNewFotoFile(null);
    setShowNewForm(false);
  };

  const deleteProdotto = async (id) => {
    const { error } = await sb.from('prodotti').delete().eq('id', id);
    if (error) {
      mostraToast('Errore nell’eliminare il prodotto: ' + error.message);
      return;
    }
    setProdotti(prodotti.filter(p => p.id !== id));
  };

  const startEditProdotto = (p) => {
    setEditingId(p.id);
    setEditNome(p.nome);
    setEditPrezzo(String(p.prezzo).replace('.', ','));
  };

  const aggiornaZonaProdotto = async (id, zona) => {
    const { error } = await sb.from('prodotti').update({ zona: zona || null }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare la zona: ' + error.message);
      return;
    }
    setProdotti(prodotti.map(p => p.id === id ? { ...p, zona } : p));
  };

  const confirmEditProdotto = async (id) => {
    const nome = editNome.trim();
    const prezzo = parseFloat(editPrezzo.replace(',', '.'));
    setEditingId(null);
    if (!nome || isNaN(prezzo) || prezzo <= 0) return;
    const { error } = await sb.from('prodotti').update({ nome, prezzo }).eq('id', id);
    if (error) {
      mostraToast('Errore nel salvare le modifiche: ' + error.message);
      return;
    }
    setProdotti(prodotti.map(p => p.id === id ? { ...p, nome, prezzo } : p));
  };

  const cambiaFotoProdotto = async (p, file) => {
    if (!file) return;
    setCaricandoFotoId(p.id);
    try {
      const blob = await comprimiImmagine(file);
      const path = `${p.id}-${Date.now()}.jpg`;
      const { error: uploadError } = await sb.storage.from('prodotti-foto').upload(path, blob, { contentType: 'image/jpeg' });
      if (uploadError) throw uploadError;
      const { error: dbError } = await sb.from('prodotti').update({ foto_path: path }).eq('id', p.id);
      if (dbError) throw dbError;
      const vecchioPath = p.fotoPath;
      const fotoUrl = sb.storage.from('prodotti-foto').getPublicUrl(path).data.publicUrl;
      setProdotti(prev => prev.map(x => x.id === p.id ? { ...x, fotoPath: path, fotoUrl } : x));
      if (vecchioPath) sb.storage.from('prodotti-foto').remove([vecchioPath]).catch(() => {});
    } catch (err) {
      mostraToast('Errore nel caricare la foto: ' + err.message);
    }
    setCaricandoFotoId(null);
  };

  // Import listino fornitore — legge un CSV/Excel esportato dall'area riservata
  // del fornitore (Tecnomat, Deghi, IDM...) e aggiunge i prodotti al catalogo.
  // il proprietario lo fa da solo, senza dover chiamare nessuno.
  const importaCatalogo = (file) => {
    if (!file) return;
    setImporting(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const testo = e.target.result;
        const righe = testo.split('\n').map(r => r.trim()).filter(Boolean);
        // formato atteso: Nome,Categoria,Sottocategoria,Tier,Prezzo
        const nuovi = righe.slice(1).map((riga) => {
          const cols = riga.split(',').map(c => c.trim());
          return {
            nome: cols[0] || 'Prodotto importato',
            categoria: cols[1] || activeCat,
            sottocategoria: cols[2] || 'Generico',
            tier: cols[3] || 'Standard',
            prezzo: parseFloat(cols[4]) || 0,
          };
        }).filter(p => p.nome !== 'Prodotto importato' || righe.length > 1);

        if (nuovi.length > 0) {
          const { data, error } = await sb.from('prodotti').insert(nuovi.map(prodottoToRow)).select();
          if (error) throw error;
          setProdotti(prev => [...data.map(prodottoFromRow), ...prev]);
          setImportMsg({ tipo: 'ok', testo: `${nuovi.length} prodotti importati dal listino.` });
        } else {
          setImportMsg({ tipo: 'err', testo: 'Il file non contiene righe valide. Usa il formato: Nome,Categoria,Sottocategoria,Qualità,Prezzo' });
        }
      } catch (err) {
        setImportMsg({ tipo: 'err', testo: 'Non sono riuscito a leggere il file. Controlla il formato ed riprova.' });
      }
      setImporting(false);
      setTimeout(() => setImportMsg(null), 5000);
    };
    reader.readAsText(file);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">

      {/* Aggiorna catalogo — import autonomo del listino fornitore */}
      <div className="app-card p-4 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-start gap-3 min-w-0">
          <div className="w-9 h-9 rounded-lg bg-blue-50 flex items-center justify-center shrink-0">
            <Download className="w-[18px] h-[18px] text-blue-600" />
          </div>
          <div className="min-w-0">
            <p className="text-sm font-semibold text-slate-900">Aggiorna catalogo dal fornitore</p>
            <p className="text-xs text-slate-400 mt-0.5">File CSV esportato dall'area riservata del fornitore</p>
          </div>
        </div>
        <label className={`shrink-0 flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2.5 rounded-lg cursor-pointer transition-colors ${importing ? 'bg-slate-100 text-slate-400' : 'bg-slate-900 hover:bg-slate-800 text-white'}`}>
          {importing ? 'Importazione...' : 'Carica listino'}
          <input
            type="file"
            accept=".csv,.txt"
            className="hidden"
            disabled={importing}
            onChange={(e) => { if (e.target.files[0]) importaCatalogo(e.target.files[0]); e.target.value = ''; }}
          />
        </label>
      </div>
      {importMsg && (
        <div className={`px-4 py-2.5 rounded-lg text-xs font-semibold ${importMsg.tipo === 'ok' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}`}>
          {importMsg.testo}
        </div>
      )}

      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex gap-1.5 bg-white border border-slate-200 rounded-xl p-1 overflow-x-auto">
          {[...new Set([...categorieCatalogo, ...prodotti.map(p => p.categoria).filter(Boolean)])].map((cat) => (
            <button
              key={cat}
              onClick={() => { setActiveCat(cat); setActiveSub('Tutte'); }}
              className={`px-3.5 py-2.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${
                activeCat === cat ? 'bg-slate-900 text-white' : 'text-slate-500 hover:text-slate-900'
              }`}
            >
              {cat}
            </button>
          ))}
        </div>
        <button
          onClick={() => setShowNewForm(!showNewForm)}
          className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors"
        >
          <Plus className="w-3.5 h-3.5" />
          Nuovo prodotto
        </button>
      </div>

      {/* filtro fornitore — es. "solo Deghi" quando mostri i bagni al cliente,
          "solo Tecnomat" quando fai un ordine */}
      <div className="flex flex-wrap gap-1.5">
        {['Tutti', ...FORNITORI_CATALOGO].map(f => (
          <button
            key={f}
            onClick={() => { setActiveFornitoreFiltro(f); setActiveSub('Tutte'); }}
            className={`px-3.5 py-2.5 rounded-full text-xs font-semibold transition-colors ${
              activeFornitoreFiltro === f ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-100'
            }`}
          >
            {f}
          </button>
        ))}
      </div>

      {/* sottocategorie della categoria attiva — filtro rapido richiesto dal cliente */}
      {sottocategorie.length > 1 && (
        <div className="flex flex-wrap gap-1.5">
          {sottocategorie.map(sub => (
            <button
              key={sub}
              onClick={() => setActiveSub(sub)}
              className={`px-3.5 py-2.5 rounded-full text-xs font-semibold transition-colors ${
                activeSub === sub ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
              }`}
            >
              {sub}
            </button>
          ))}
        </div>
      )}

      {showNewForm && (
        <div className="app-card p-4 space-y-3">
          <p className="text-xs font-semibold text-slate-500">Nuovo prodotto in "{activeCat}"</p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Nome prodotto</label>
              <input
                type="text"
                value={newNome}
                onChange={(e) => setNewNome(e.target.value)}
                placeholder="Es. Caldaia Vaillant 28kW"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Fornitore</label>
              <select
                value={fornitoreForm}
                onChange={(e) => { setNewFornitore(e.target.value); setNewSub(''); }}
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              >
                {FORNITORI_CATALOGO.map(f => <option key={f} value={f}>{f}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Sottocategoria</label>
              {sottocategorieStruttura.length > 0 ? (
                <select
                  value={newSub}
                  onChange={(e) => setNewSub(e.target.value)}
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                >
                  <option value="">Scegli...</option>
                  {sottocategorieStruttura.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              ) : (
                <input
                  type="text"
                  value={newSub}
                  onChange={(e) => setNewSub(e.target.value)}
                  placeholder="Es. Filo muro"
                  className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              )}
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Qualità</label>
              <select
                value={newTier}
                onChange={(e) => setNewTier(e.target.value)}
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              >
                <option>Standard</option>
                <option>Premium</option>
                <option>Lusso</option>
              </select>
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Codice articolo</label>
              <input
                type="text"
                value={newCodice}
                onChange={(e) => setNewCodice(e.target.value)}
                placeholder="Es. 3100915"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo €</label>
              <input
                type="text"
                inputMode="decimal"
                value={newPrezzo}
                onChange={(e) => setNewPrezzo(e.target.value)}
                placeholder="0,00"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Lunghezza cm</label>
              <input
                type="text"
                inputMode="decimal"
                value={newLunghezza}
                onChange={(e) => setNewLunghezza(e.target.value)}
                placeholder="0"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Profondità cm</label>
              <input
                type="text"
                inputMode="decimal"
                value={newProfondita}
                onChange={(e) => setNewProfondita(e.target.value)}
                placeholder="0"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Altezza cm</label>
              <input
                type="text"
                inputMode="decimal"
                value={newAltezza}
                onChange={(e) => setNewAltezza(e.target.value)}
                placeholder="0"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-medium text-slate-500 mb-1">Descrizione</label>
            <textarea
              value={newDescrizione}
              onChange={(e) => setNewDescrizione(e.target.value)}
              rows={2}
              placeholder="Dettagli utili per il cliente o per l'ordine"
              className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 resize-none"
            />
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Foto</label>
              <label className="flex items-center gap-2 w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg cursor-pointer text-slate-500">
                <ImagePlus className="w-4 h-4 shrink-0" />
                <span className="truncate">{newFotoFile ? newFotoFile.name : 'Scatta o carica una foto'}</span>
                <input
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => setNewFotoFile(e.target.files[0] || null)}
                />
              </label>
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Link scheda tecnica (opzionale)</label>
              <input
                type="text"
                value={newSchedaUrl}
                onChange={(e) => setNewSchedaUrl(e.target.value)}
                placeholder="https://..."
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>

          <div className="flex items-center gap-2 justify-end pt-1">
            {erroreNuovo && <p className="text-[11px] text-red-500 mr-auto">{erroreNuovo}</p>}
            <button onClick={() => setShowNewForm(false)} className="px-3 py-2 text-slate-400 hover:text-slate-600">
              <X className="w-4 h-4" />
            </button>
            <button onClick={addProdotto} disabled={salvandoNuovo} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60">
              {salvandoNuovo ? 'Salvo...' : 'Aggiungi'}
            </button>
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {filtered.map((p) => (
          <div key={p.id} className="app-card overflow-hidden group">
            <label className="h-28 bg-slate-50 flex flex-col items-center justify-center gap-1.5 relative cursor-pointer overflow-hidden">
              {p.fotoUrl ? (
                <img src={p.fotoUrl} alt={p.nome} className="w-full h-full object-cover" />
              ) : (
                <>
                  <ImagePlus className="w-5 h-5 text-slate-300" />
                  <span className="text-[10.5px] font-medium text-slate-400">Foto da aggiungere</span>
                </>
              )}
              {caricandoFotoId === p.id && (
                <div className="absolute inset-0 bg-white/80 flex items-center justify-center text-[11px] font-semibold text-slate-500">
                  Carico...
                </div>
              )}
              <div className={`absolute inset-0 bg-black/0 lg:group-hover:bg-black/25 transition-colors flex items-center justify-center ${p.fotoUrl ? 'opacity-0 lg:group-hover:opacity-100' : ''}`}>
                {p.fotoUrl && <span className="text-white text-[11px] font-semibold">Cambia foto</span>}
              </div>
              <input
                type="file"
                accept="image/*"
                className="hidden"
                disabled={caricandoFotoId === p.id}
                onChange={(e) => { if (e.target.files[0]) cambiaFotoProdotto(p, e.target.files[0]); e.target.value = ''; }}
              />
              <span className={`absolute top-2 left-2 text-[10px] font-semibold px-2 py-1 rounded-full ${tierStyle[p.tier]}`}>
                {p.tier}
              </span>
              <button
                type="button"
                onClick={(e) => { e.preventDefault(); e.stopPropagation(); deleteProdotto(p.id); }}
                className="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 text-slate-400 hover:text-red-500 flex items-center justify-center opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity"
              >
                <Trash2 className="w-3.5 h-3.5" />
              </button>
            </label>
            <div className="p-3.5">
              {p.sottocategoria && <p className="text-[10px] font-semibold text-blue-500 uppercase tracking-wide mb-1">{p.sottocategoria}</p>}
              {editingId === p.id ? (
                <div className="space-y-1.5">
                  <input
                    autoFocus
                    type="text"
                    value={editNome}
                    onChange={(e) => setEditNome(e.target.value)}
                    className="w-full px-2 py-1 text-[13px] font-semibold bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                  />
                  <div className="flex items-center gap-1.5">
                    <span className="text-slate-400 text-xs">€</span>
                    <input
                      type="text"
                      inputMode="decimal"
                      value={editPrezzo}
                      onChange={(e) => setEditPrezzo(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && confirmEditProdotto(p.id)}
                      className="w-20 px-2 py-1 text-sm bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                    />
                    <button onClick={() => confirmEditProdotto(p.id)} className="text-emerald-600 hover:text-emerald-700">
                      <Check className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ) : (
                <button onClick={() => startEditProdotto(p)} className="text-left w-full group/edit">
                  <p className="text-[13px] font-semibold text-slate-900 leading-snug min-h-[34px] group-hover/edit:text-blue-600 transition-colors">{p.nome}</p>
                  <p className="text-base font-bold text-slate-900 mt-1.5">{fmtEuro(p.prezzo)}</p>
                  {(p.fornitore || p.codice) && (
                    <p className="text-[10px] text-slate-400 mt-1 font-mono truncate">
                      {[p.fornitore, p.codice].filter(Boolean).join(' · ')}
                    </p>
                  )}
                  {(p.misuraLunghezza || p.misuraProfondita || p.misuraAltezza) && (
                    <p className="text-[10px] text-slate-400 mt-1">
                      {p.misuraLunghezza || '–'}×{p.misuraProfondita || '–'}×{p.misuraAltezza || '–'} cm
                    </p>
                  )}
                </button>
              )}
              {p.descrizione && (
                <p className="text-[11px] text-slate-500 mt-1.5 line-clamp-2">{p.descrizione}</p>
              )}
              {p.schedaTecnicaUrl && (
                <a
                  href={p.schedaTecnicaUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={(e) => e.stopPropagation()}
                  className="text-[10px] text-blue-500 hover:text-blue-600 mt-1 inline-block"
                >
                  Scheda tecnica →
                </a>
              )}
              <select
                value={p.zona || ''}
                onChange={(e) => aggiornaZonaProdotto(p.id, e.target.value)}
                onClick={(e) => e.stopPropagation()}
                className="mt-2 w-full text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-md px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500/30"
              >
                <option value="">Tutte le zone</option>
                {ZONE_AMBIENTI.map(z => <option key={z.id} value={z.id}>{z.nome}</option>)}
              </select>
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <div className="sm:col-span-2 lg:col-span-3 app-card py-14 flex flex-col items-center justify-center text-center">
            <ShoppingBag className="w-7 h-7 text-slate-300 mb-2" />
            <p className="text-sm text-slate-400">
              {prodottiLoading ? 'Caricamento catalogo...' : 'Nessun prodotto in questa categoria.'}
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================ */
/* VISTA SQUADRA — l'amministratore vede da qui cosa vedrebbe la squadra:  */
/* solo materiali e lavorazioni per zona, senza prezzi. Nessun   */
/* login separato per ora, ma la struttura è già predisposta.    */
/* ============================================================ */
function SquadraPage({ preventivi, clienti }) {
  const lavoriAttivi = preventivi.filter(p => p.stato === 'In Attesa' || p.stato === 'Accettato');

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
      {lavoriAttivi.length === 0 ? (
        <div className="app-card py-16 flex flex-col items-center justify-center text-center">
          <Wrench className="w-7 h-7 text-slate-300 mb-2" />
          <p className="text-sm text-slate-400">Nessun lavoro attivo al momento.</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          {lavoriAttivi.map(p => {
            const cliente = clienti.find(c => c.id === p.clienteId);
            const zone = p.zone || [];
            const carrelloSnap = p.carrelloSnapshot || [];
            return (
              <div key={p.id} className="app-card overflow-hidden">
                <div className="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <p className="text-sm font-semibold text-slate-900">{p.cantiere}</p>
                    <p className="text-xs text-slate-400 mt-0.5">{cliente?.nome || p.cliente}</p>
                  </div>
                  <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium ${statoStyle[p.stato]}`}>{p.stato}</span>
                </div>
                <div className="p-4 space-y-3">
                  {zone.length > 0 ? (
                    zone.map(zonaId => {
                      const zonaInfo = ZONE_AMBIENTI.find(z => z.id === zonaId);
                      const vociZona = carrelloSnap.filter(i => (i.zona || 'generico') === zonaId);
                      return (
                        <div key={zonaId}>
                          <p className="text-xs font-bold text-slate-700 flex items-center gap-2 mb-1">
                            <ZonaIcon zonaId={zonaInfo?.id || zonaId} className="text-slate-500 shrink-0" size={14} />
                            {zonaInfo?.nome || zonaId}
                          </p>
                          <ul className="space-y-0.5 pl-1">
                            {vociZona.map(v => (
                              <li key={v.id} className="text-xs text-slate-500 flex items-center gap-1.5">
                                <span className="text-slate-300">•</span>
                                {v.nome} <span className="text-slate-400 font-mono">({v.qty})</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      );
                    })
                  ) : (
                    <p className="text-xs text-slate-400">Nessuna zona specificata per questo preventivo.</p>
                  )}
                  {p.nFoto > 0 && (
                    <p className="text-[11px] text-slate-400 flex items-center gap-1.5 pt-1 border-t border-slate-50">
                      <ImagePlus className="w-3 h-3" /> {p.nFoto} foto cantiere archiviate
                    </p>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}



const pageConfig = {
  dashboard: { title: 'Dashboard', subtitle: null },
  preventivi: { title: 'Preventivi', subtitle: null },
  clienti: { title: 'Clienti', subtitle: null },
  materiali: { title: 'Materiali', subtitle: null },
  catalogo: { title: 'Catalogo', subtitle: null },
  squadra: { title: 'Lavori Squadra', subtitle: null },
};

// notifiche in-app al posto di alert() nativo — un popup del browser mostra
// la barra degli indirizzi/i bottoni del sistema e rompe subito l'illusione
// di app vera; questo resta dentro lo stile dell'app
function mostraToast(messaggio, tipo = 'errore') {
  window.dispatchEvent(new CustomEvent('ferari-toast', { detail: { messaggio, tipo } }));
}

function ToastHost() {
  const [toast, setToast] = useState(null);
  useEffect(() => {
    let timer;
    const onToast = (e) => {
      setToast(e.detail);
      clearTimeout(timer);
      timer = setTimeout(() => setToast(null), 4500);
    };
    window.addEventListener('ferari-toast', onToast);
    return () => { window.removeEventListener('ferari-toast', onToast); clearTimeout(timer); };
  }, []);
  if (!toast) return null;
  return (
    <div className="fixed inset-x-0 z-[100] px-4 flex justify-center bottom-[calc(5.5rem+env(safe-area-inset-bottom))] lg:bottom-6 pointer-events-none">
      <div className={`pointer-events-auto w-full max-w-sm rounded-xl shadow-xl px-4 py-3 text-sm font-medium text-white flex items-start gap-3 ${toast.tipo === 'errore' ? 'bg-red-600' : 'bg-slate-900'}`}>
        <span className="flex-1 leading-snug">{toast.messaggio}</span>
        <button onClick={() => setToast(null)} className="shrink-0 opacity-80 hover:opacity-100">
          <X className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
}

function App() {
  // sessione Supabase: undefined = verifica in corso, null = non loggato,
  // oggetto = loggato. Supabase la ricorda da solo tra un riavvio e l'altro.
  const [session, setSession] = useState(undefined);
  // true quando l'utente arriva dal link "Password dimenticata?" nell'email:
  // mostra la schermata per scegliere la nuova password invece della dashboard
  const [modalitaRecupero, setModalitaRecupero] = useState(false);
  // ricorda l'ultima pagina visitata, così un refresh non riporta sempre alla dashboard
  const [currentPage, setCurrentPage] = useState(() => {
    const salvata = localStorage.getItem('ferari_currentPage');
    return salvata && pageConfig[salvata] ? salvata : 'dashboard';
  });
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const codaOffline = useCodaOffline();

  useEffect(() => {
    localStorage.setItem('ferari_currentPage', currentPage);
  }, [currentPage]);

  // stato centrale: tutta l'app legge e scrive da qui
  const [clienti, setClienti] = useState([]);
  const [clientiLoading, setClientiLoading] = useState(true);
  const [materiali, setMateriali] = useState([]);
  const [materialiLoading, setMaterialiLoading] = useState(true);
  const [prodotti, setProdotti] = useState([]);
  const [prodottiLoading, setProdottiLoading] = useState(true);
  const [preventivi, setPreventivi] = useState([]);
  const [preventiviLoading, setPreventiviLoading] = useState(true);
  const [presetClienteId, setPresetClienteId] = useState(null);
  const [presetDettaglioId, setPresetDettaglioId] = useState(null);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: subscription } = sb.auth.onAuthStateChange((event, nuovaSessione) => {
      if (event === 'PASSWORD_RECOVERY') setModalitaRecupero(true);
      setSession(nuovaSessione);
    });
    return () => subscription.subscription.unsubscribe();
  }, []);

  // clienti: caricati da Supabase dopo il login, così restano salvati anche
  // dopo aver chiuso e riaperto l'app
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setClientiLoading(true);
    sb.from('clienti').select('*').order('creato_il', { ascending: false }).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare i clienti da Supabase:', error);
        setClientiLoading(false);
        return;
      }
      setClienti(data.map(clienteFromRow));
      setClientiLoading(false);
    });
    return () => { annullato = true; };
  }, [session]);

  // preventivi: stesso pattern dei clienti
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setPreventiviLoading(true);
    sb.from('preventivi').select('*').order('creato_il', { ascending: false }).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare i preventivi da Supabase:', error);
        setPreventiviLoading(false);
        return;
      }
      setPreventivi(data.map(preventivoFromRow));
      setPreventiviLoading(false);
    });
    return () => { annullato = true; };
  }, [session]);

  // materiali: stesso pattern
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setMaterialiLoading(true);
    sb.from('materiali').select('*').order('nome', { ascending: true }).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare i materiali da Supabase:', error);
        setMaterialiLoading(false);
        return;
      }
      setMateriali(data.map(materialeFromRow));
      setMaterialiLoading(false);
    });
    return () => { annullato = true; };
  }, [session]);

  // prodotti (catalogo): stesso pattern
  useEffect(() => {
    if (!session) return;
    let annullato = false;
    setProdottiLoading(true);
    sb.from('prodotti').select('*').order('nome', { ascending: true }).then(({ data, error }) => {
      if (annullato) return;
      if (error) {
        console.error('Errore nel caricare il catalogo da Supabase:', error);
        setProdottiLoading(false);
        return;
      }
      setProdotti(data.map(prodottoFromRow));
      setProdottiLoading(false);
    });
    return () => { annullato = true; };
  }, [session]);

  if (session === undefined) {
    return (
      <div className="min-h-[100dvh] bg-[#10133a] flex items-center justify-center">
        <img src={LOGO_BASE64} alt="Ferari Impianti" className="w-16 h-16 rounded-2xl opacity-80" />
      </div>
    );
  }

  if (modalitaRecupero) {
    return <ImpostaNuovaPasswordPage onCompletato={() => setModalitaRecupero(false)} />;
  }

  if (!session) {
    return <LoginPage />;
  }

  const { title, subtitle } = pageConfig[currentPage];

  const handleNuovoPreventivo = (clienteId) => {
    setPresetClienteId(clienteId);
    setCurrentPage('preventivi');
  };

  const handleApriPreventivo = (preventivoId) => {
    setPresetDettaglioId(preventivoId);
    setCurrentPage('preventivi');
  };

  const goToPage = (page) => {
    setCurrentPage(page);
    setMobileNavOpen(false);
    const main = document.querySelector('main.app-scroll');
    if (main) main.scrollTop = 0;
  };

  return (
    <div className="h-[100dvh] flex bg-[#eef1f5] lg:bg-slate-50 overflow-hidden">
      <ToastHost />
      <Sidebar
        currentPage={currentPage}
        setCurrentPage={goToPage}
        onLogout={() => sb.auth.signOut()}
        mobileOpen={mobileNavOpen}
        onMobileClose={() => setMobileNavOpen(false)}
      />

      <div className="flex-1 flex flex-col min-w-0 min-h-0">
        <TopBar title={title} subtitle={subtitle} onMenuClick={() => setMobileNavOpen(true)} />

        {(!codaOffline.online || codaOffline.count > 0) && (
          <div className={`px-4 py-2 text-xs font-semibold flex items-center justify-between gap-2 shrink-0 ${!codaOffline.online ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}`}>
            <span>
              {!codaOffline.online
                ? 'Sei offline — le modifiche restano sul telefono e si caricano da sole alla riconnessione.'
                : `${codaOffline.count} element${codaOffline.count === 1 ? 'o' : 'i'} in attesa di sincronizzazione.`}
            </span>
            {codaOffline.online && codaOffline.count > 0 && (
              <button
                onClick={codaOffline.sincronizzaOra}
                disabled={codaOffline.sincronizzando}
                className="shrink-0 bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-md disabled:opacity-60"
              >
                {codaOffline.sincronizzando ? 'Sincronizzo...' : 'Sincronizza ora'}
              </button>
            )}
          </div>
        )}

        <main className="flex-1 overflow-y-auto app-scroll pb-[calc(6rem+env(safe-area-inset-bottom))] lg:pb-0">
          <div key={currentPage} className="app-page">
        {currentPage === 'dashboard' && (
          <DashboardPage preventivi={preventivi} clienti={clienti} onVediTutti={() => setCurrentPage('preventivi')} />
        )}
        {currentPage === 'preventivi' && (
          <PreventiviPage
            clienti={clienti}
            setClienti={setClienti}
            clientiLoading={clientiLoading}
            preventivi={preventivi}
            setPreventivi={setPreventivi}
            preventiviLoading={preventiviLoading}
            materiali={materiali}
            setMateriali={setMateriali}
            prodotti={prodotti}
            presetClienteId={presetClienteId}
            onConsumePreset={() => setPresetClienteId(null)}
            presetDettaglioId={presetDettaglioId}
            onConsumePresetDettaglio={() => setPresetDettaglioId(null)}
          />
        )}
        {currentPage === 'clienti' && (
          <ClientiPage
            clienti={clienti}
            setClienti={setClienti}
            clientiLoading={clientiLoading}
            preventivi={preventivi}
            onNuovoPreventivo={handleNuovoPreventivo}
            onApriPreventivo={handleApriPreventivo}
          />
        )}
        {currentPage === 'materiali' && <MaterialiPage materiali={materiali} setMateriali={setMateriali} materialiLoading={materialiLoading} />}
        {currentPage === 'catalogo' && <CatalogoPage prodotti={prodotti} setProdotti={setProdotti} prodottiLoading={prodottiLoading} />}
        {currentPage === 'squadra' && <SquadraPage preventivi={preventivi} clienti={clienti} />}
          </div>
        </main>
      </div>

      <MobileBottomNav currentPage={currentPage} setCurrentPage={goToPage} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
