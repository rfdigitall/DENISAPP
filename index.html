   GOOGLE CALENDAR (Fase 7) — modulo isolato e opzionale.
   Se GOOGLE_CALENDAR_CLIENT_ID è vuoto, il pulsante "Aggiungi a Google
   Calendar" semplicemente non appare da nessuna parte: il resto
   dell'app funziona esattamente come prima, con o senza questo.
   ============================================================ */
const GOOGLE_CALENDAR_CLIENT_ID = ''; // incolla qui il Client ID da Google Cloud Console

let googleTokenClient = null;
let googleAccessToken = null;
let googleAccessTokenScade = 0;

function googleCalendarDisponibile() {
  return !!GOOGLE_CALENDAR_CLIENT_ID && !!(window.google && window.google.accounts && window.google.accounts.oauth2);
}

function inizializzaGoogleTokenClient() {
  if (googleTokenClient || !googleCalendarDisponibile()) return;
  googleTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CALENDAR_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: () => {}, // sovrascritto ad ogni richiesta, vedi sotto
  });
}

// restituisce un token valido, chiedendo il consenso a Denis solo la
// prima volta (o quando il token è scaduto) — non ad ogni utilizzo
function otteniTokenGoogle() {
  return new Promise((resolve, reject) => {
    if (!googleCalendarDisponibile()) { reject(new Error('Google Calendar non configurato')); return; }
    inizializzaGoogleTokenClient();
    if (googleAccessToken && Date.now() < googleAccessTokenScade) {
      resolve(googleAccessToken);
      return;
    }
    googleTokenClient.callback = (risposta) => {
      if (risposta.error) { reject(new Error(risposta.error)); return; }
      googleAccessToken = risposta.access_token;
      googleAccessTokenScade = Date.now() + ((risposta.expires_in || 3600) - 60) * 1000;
      resolve(googleAccessToken);
    };
    // "" = prova prima in silenzio se Denis ha già autorizzato in questa sessione browser
    googleTokenClient.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
  });
}

async function creaEventoGoogleCalendar({ titolo, luogo, descrizione, dataOraInizio, durataMinuti = 60 }) {
  const token = await otteniTokenGoogle();
  const inizio = new Date(dataOraInizio);
  const fine = new Date(inizio.getTime() + durataMinuti * 60000);
  const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      summary: titolo,
      location: luogo || '',
      description: descrizione || '',
      start: { dateTime: inizio.toISOString() },
      end: { dateTime: fine.toISOString() },
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error((err.error && err.error.message) || 'Errore nella creazione dell’evento');
  }
  return res.json();
}

// una voce (materiale o prodotto) è visibile nella zona attiva se non è

}

// ridimensiona e comprime una foto lato browser prima di caricarla, così
// non si riempie lo storage gratuito con immagini enormi dal telefono
function comprimiImmagine(file, maxLato = 900, qualita = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scala = Math.min(1, maxLato / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scala);
      canvas.height = Math.round(img.height * scala);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        blob ? resolve(blob) : reject(new Error('Compressione immagine fallita'));
      }, 'image/jpeg', qualita);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Immagine non valida')); };
    img.src = url;
  });
}

/* ============================================================ */
/* CODA OFFLINE — Denis lavora spesso in cantieri senza segnale.  */
/* Se una foto/documento/preventivo non riesce a salvarsi per la  */
/* rete, finisce qui (IndexedDB) invece di andare perso, e si     */
/* carica da solo alla riconnessione.                             */
/* ============================================================ */
const DB_OFFLINE_NOME = 'ferari_coda_offline';
const DB_OFFLINE_STORE = 'coda';

function apriDbOffline() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_OFFLINE_NOME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(DB_OFFLINE_STORE, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function accodaOffline(tipo, dati) {
  const db = await apriDbOffline();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DB_OFFLINE_STORE, 'readwrite');
    const req = tx.objectStore(DB_OFFLINE_STORE).add({ tipo, dati, creato: Date.now() });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  window.dispatchEvent(new Event('ferari-coda-offline'));
}

function leggiCodaOffline() {
  return apriDbOffline().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_OFFLINE_STORE, 'readonly');
    const req = tx.objectStore(DB_OFFLINE_STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

async function rimuoviDaCodaOffline(id) {
  const db = await apriDbOffline();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(DB_OFFLINE_STORE, 'readwrite');
    const req = tx.objectStore(DB_OFFLINE_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
  window.dispatchEvent(new Event('ferari-coda-offline'));
}

// prova a svuotare la coda: si ferma al primo errore vero (rete ancora
// giù) lasciando il resto in coda per il prossimo tentativo
async function sincronizzaCodaOffline() {
  if (!navigator.onLine) return { fatti: 0 };
  let voci;
  try { voci = await leggiCodaOffline(); } catch (e) { return { fatti: 0 }; }
  let fatti = 0;
  for (const voce of voci) {
    try {
      if (voce.tipo === 'documento') {
        const { blob, nome, clienteId } = voce.dati;
        const path = `${clienteId}/${Date.now()}-${nome}`;
        const { error: upErr } = await sb.storage.from('documenti-cliente').upload(path, blob);
        if (upErr) throw upErr;
        const { error: insErr } = await sb.from('documenti').insert(documentoToRow({ clienteId, nome, storagePath: path }));
        if (insErr) throw insErr;
      } else if (voce.tipo === 'preventivo_foto') {
        const { preventivoId, clienteId, foto } = voce.dati;
        for (const f of foto) {
          const path = `${clienteId || 'senza-cliente'}/${Date.now()}-${f.tipo}.jpg`;
          const { error: upErr } = await sb.storage.from('cantiere-foto').upload(path, f.blob, { contentType: 'image/jpeg' });
          if (upErr) throw upErr;
          const { error: insErr } = await sb.from('foto').insert(fotoToRow({ preventivoId, clienteId, zona: f.zona, tipo: f.tipo, storagePath: path }));
          if (insErr) throw insErr;
        }
      } else if (voce.tipo === 'preventivo') {
        const { modificaId, modificaDbId, payload, fotoPendenti } = voce.dati;
        let preventivoDbId = modificaDbId || null;
        if (modificaId) {
          const { error } = await sb.from('preventivi').update(preventivoToRow(payload)).eq('numero', modificaId);
          if (error) throw error;
        } else {
          const { data, error } = await sb.from('preventivi').insert(preventivoToRow(payload)).select().single();
          if (error) throw error;
          preventivoDbId = data.id;
        }
        for (const f of (fotoPendenti || [])) {
          const path = `${payload.clienteId || 'senza-cliente'}/${Date.now()}-${f.tipo}.jpg`;
          const { error: upErr } = await sb.storage.from('cantiere-foto').upload(path, f.blob, { contentType: 'image/jpeg' });
          if (upErr) throw upErr;
          await sb.from('foto').insert(fotoToRow({ preventivoId: preventivoDbId, clienteId: payload.clienteId, zona: f.zona, tipo: f.tipo, storagePath: path }));
        }
      }
      await rimuoviDaCodaOffline(voce.id);
      fatti++;
    } catch (err) {
      break; // rete caduta di nuovo o errore vero: riprova al prossimo giro
    }
  }
  return { fatti };
}

// hook globale: quanti elementi sono in attesa + stato connessione,
// con sync automatico alla riconnessione
function useCodaOffline() {
  const [count, setCount] = React.useState(0);
  const [online, setOnline] = React.useState(navigator.onLine);
  const [sincronizzando, setSincronizzando] = React.useState(false);
  const aggiorna = React.useCallback(() => {
    leggiCodaOffline().then(v => setCount(v.length)).catch(() => {});
  }, []);
  const sincronizzaOra = React.useCallback(async () => {
    setSincronizzando(true);
    const { fatti } = await sincronizzaCodaOffline();
    setSincronizzando(false);
    aggiorna();
    if (fatti > 0) window.location.reload();
  }, [aggiorna]);
  React.useEffect(() => {
    aggiorna();
    const onCoda = () => aggiorna();
    const onOnline = () => { setOnline(true); sincronizzaOra(); };
    const onOffline = () => setOnline(false);
    window.addEventListener('ferari-coda-offline', onCoda);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => {
      window.removeEventListener('ferari-coda-offline', onCoda);
      window.removeEventListener('online', onOnline);
      window.removeEventListener('offline', onOffline);
    };
  }, [aggiorna, sincronizzaOra]);
  return { count, online, sincronizzando, sincronizzaOra };
}

/* ============================================================
   ICONE SVG INLINE — sostituiscono lucide-react.
   Nessuna dipendenza esterna: cos� la pagina non pu� rompersi
   se un CDN non risponde o cambia il nome della variabile globale.
   ============================================================ */
function makeIcon(name, children) {
  const Icon = function (props) {
    const { className, size, strokeWidth, style, title, ...rest } = props || {};
    return React.createElement(
      'svg',
      Object.assign(
        {
          xmlns: 'http://www.w3.org/2000/svg',
          width: size || 24,
          height: size || 24,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: strokeWidth || 2,
          strokeLinecap: 'round',

// favicon / icona "aggiungi a schermata Home" -- usa il logo vero invece
// dell'icona blu generica del browser (Android legge il manifest, iOS
// legge apple-touch-icon; il manifest e' generato al volo come Blob per
// restare in un unico file, senza aggiungere un manifest.json separato)
(function iniettaIconaApp() {
  const link = (rel, href, type) => {
    const el = document.createElement('link');
    el.rel = rel;
    el.href = href;
    if (type) el.type = type;
    document.head.appendChild(el);
  };
  link('icon', LOGO_BASE64, 'image/png');
  link('apple-touch-icon', LOGO_BASE64);
  const manifest = {
    name: 'Ferari Impianti',
    short_name: 'Ferari',
    start_url: '.',
    display: 'standalone',
    background_color: '#eef1f5',
    theme_color: '#10133a',
    icons: [{ src: LOGO_BASE64, sizes: 'any', type: 'image/png' }],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  link('manifest', URL.createObjectURL(blob));
})();

const ORDINE_STATO_PRIORITA = ['In Corso', 'Accettato', 'Inviato', 'In Attesa', 'Rifiutato'];
const ordinaPerPriorita = (lista) => [...lista].sort((a, b) => {
  const ia = ORDINE_STATO_PRIORITA.indexOf(a.stato);
  const ib = ORDINE_STATO_PRIORITA.indexOf(b.stato);
  return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
});

const fmtEuro = (n) => n.toLocaleString('it-IT', { minimumFractionDigits: 0 }) + ' €';
const fmtEuro2 = (n) => n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

/* ============================================================
   FASE 4 — dicitura del documento cliente: ogni voce del carrello
   viene raggruppata per CATEGORIA (tipo di intervento, non zona) con
   una descrizione modificabile, come nei preventivi reali di Denis.

const CATEGORIE_DOCUMENTO_DEFAULT = [
  'SMANTELLAMENTO E SMALTIMENTO',
  'OPERE IDRAULICHE E TERMOSANITARIE',
  'INSTALLAZIONE E COLLEGAMENTO IMPIANTO DI CLIMATIZZAZIONE',
  'PREDISPOSIZIONI, ASSISTENZA ELETTRICA E FINITURE',
];

function categoriaDefaultVoce(item) {
  const nome = (item.nome || '').toLowerCase();
  if (item.zona === 'centrale' || nome.includes('caldaia') || nome.includes('climatizzat')) {
    return 'INSTALLAZIONE E COLLEGAMENTO IMPIANTO DI CLIMATIZZAZIONE';
  }
  if (nome.includes('elettric') || nome.includes('cavo') || nome.includes('presa') || nome.includes('placca') || nome.includes('interruttore') || nome.includes('scatola')) {
    return 'PREDISPOSIZIONI, ASSISTENZA ELETTRICA E FINITURE';
  }
  return 'OPERE IDRAULICHE E TERMOSANITARIE';
}

function dicituraDefaultVoce(item) {
  if (item.kind === 'prodotto') {
    const smontaggio = item.tipoInstallazione === 'sostituzione'
      ? `Smontaggio e smaltimento del vecchio ${item.nome.toLowerCase()}. `
      : '';
    return `${smontaggio}Fornitura e installazione di ${item.nome}${item.meta ? ' (' + item.meta + ')' : ''}.`;
  }
  return `Fornitura e posa in opera di ${item.nome.toLowerCase()}.`;
}

// raggruppa il carrello per categoria documento, applicando eventuali
// modifiche manuali salvate in "diciture" ({ [itemId]: { categoria, testo } })
function raggruppaPerCategoria(carrello, diciture) {
  const gruppi = new Map();
  carrello.forEach(item => {
    const override = diciture[item.id] || {};
    const categoria = (override.categoria || categoriaDefaultVoce(item)).trim().toUpperCase() || 'ALTRI LAVORI';
    const testo = override.testo !== undefined ? override.testo : dicituraDefaultVoce(item);
    if (!gruppi.has(categoria)) gruppi.set(categoria, []);
    gruppi.get(categoria).push({ item, testo });
  });
  return [...gruppi.entries()].map(([categoria, righe]) => ({ categoria, righe }));
}

function loadJsPDF() {
  return new Promise((resolve, reject) => {
    if (window.jspdf) { resolve(window.jspdf.jsPDF); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => resolve(window.jspdf.jsPDF);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

const MARGINE_BASSO = 262; // oltre questa y si passa a una nuova pagina

async function generaPDFCliente({ cliente, carrello, diciture, totale, nextId, logoB64 }) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

  addHeaderCliente(doc, logoB64, nextId);

  let y = 74;

  const nuovaPaginaSeServe = (spazioNecessario) => {
    if (y + spazioNecessario > MARGINE_BASSO) {
      doc.addPage();
      y = 20;
    }
  };

  // anteprima cliente
  doc.setFillColor(243, 244, 246);
  doc.roundedRect(12, y, 186, 20, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...SLATE5);
  doc.text('CLIENTE', 20, y+5);
  doc.text('CANTIERE', 110, y+5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...SLATE9);
  doc.text(cliente.nome, 20, y+13);
  doc.text(cliente.indirizzo, 110, y+13);
  y += 26;

  // sezione DISEGNAZIONE LAVORI
  doc.setFillColor(...NAVY);
  doc.roundedRect(12, y, 186, 8, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...WHITE);
  doc.text('DISEGNAZIONE LAVORI', 20, y+5.5);
  y += 13;

  // corpo — voci raggruppate per categoria (tipo di intervento), niente prezzi
  const gruppi = raggruppaPerCategoria(carrello, diciture || {});
  gruppi.forEach(gruppo => {
    nuovaPaginaSeServe(9);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...SLATE9);
    doc.text(gruppo.categoria, 12, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(80, 85, 92);
    gruppo.righe.forEach(({ testo }) => {
      const lines = doc.splitTextToSize(`• ${testo}`, 182);
      nuovaPaginaSeServe(lines.length * 4.5);
      doc.text(lines, 15, y);
      y += lines.length * 4.5;
    });
    y += 3;
  });

  nuovaPaginaSeServe(30);

  // IVA non esposta
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
  doc.text('IVA NON ESPOSTA', 105, y, { align:'center' }); y += 6;

  // box totale
  doc.setFillColor(...NAVY);
  doc.roundedRect(12, y, 186, 16, 3, 3, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...WHITE);
  doc.text('TOTALE', 20, y+10);
  doc.setFontSize(16);
  doc.text(`€ ${Math.round(totale).toLocaleString('it-IT')},00`, 198, y+10, { align:'right' });
  y += 22;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
  doc.text('IL TOTALE COMPRENDE MATERIALE E MANODOPERA', 105, y, { align:'center' });

  const totalePagine = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalePagine; i++) {
    doc.setPage(i);
    addFooterCliente(doc, i, totalePagine);
  }
  doc.save(`Preventivo_${cliente.nome.replace(/\s/g,'_')}_${nextId}.pdf`);
}

async function generaPDFInterno({ cliente, carrello, subMat, subProd, rincaro, totale, rincaroMode, rPct, rOre, rTar, nextId }) {

  doc.text('USO INTERNO — NON INVIARE AL CLIENTE', 12, 16);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...WHITE);
  doc.text(nextId, 198, 10, { align:'right' });
  doc.text(oggiData(), 198, 16, { align:'right' });

  let y = 30;

  // info cliente
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...SLATE9);
  doc.text(`Cliente: ${cliente.nome}`, 12, y);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(...SLATE5);
  doc.text(`Cantiere: ${cliente.indirizzo}`, 12, y+5);
  y += 12;

  // intestazione tabella
  doc.setFillColor(243, 244, 246);
  doc.rect(12, y, 186, 7, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...SLATE5);
  doc.text('MATERIALE', 15, y+5);
  doc.text('QTÀ / UNITÀ', 105, y+5);
  doc.text('P. UNITARIO', 145, y+5);
  doc.text('TOTALE', 195, y+5, { align:'right' });
  y += 10;

  // righe materiali
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  carrello.forEach((item, i) => {
    if (i % 2 === 1) { doc.setFillColor(249,250,251); doc.rect(12, y-4, 186, 7, 'F'); }
    doc.setTextColor(...SLATE9);
    doc.text(item.nome, 15, y);
    doc.setTextColor(...SLATE5);
    doc.text(item.meta, 105, y);
    doc.text(fmtEuro2(item.prezzoUnitario), 145, y);
    doc.setFont('helvetica','bold'); doc.setTextColor(...SLATE9);
    doc.text(fmtEuro2(item.prezzoUnitario * item.qty), 195, y, { align:'right' });
    doc.setFont('helvetica','normal');
    y += 7;
  });

  if (carrello.length === 0) {
    doc.setTextColor(...SLATE5);
    doc.text('Nessuna voce aggiunta.', 105, y, { align:'center' });
    y += 7;
  }

  y += 3;
  // linea separatrice
  doc.setDrawColor(...SLATE3); doc.setLineWidth(0.3);
  doc.line(12, y, 198, y); y += 5;

  // subtotali
  const rows = [
    ['Subtotale materiali + prodotti', fmtEuro2(subMat + subProd)],
    [rincaroMode === 'percent' ? `Manodopera (${rPct}% sui materiali)` : `Manodopera (${rOre}h × ${rTar} €/h)`, fmtEuro2(rincaro)],
  ];
  rows.forEach(([label, value]) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SLATE5);
    doc.text(label, 15, y);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...SLATE9);
    doc.text(value, 195, y, { align:'right' });
    y += 7;
  });

  y += 2;
  // box totale reale
  doc.setFillColor(...SLATE9);
  doc.roundedRect(12, y, 186, 14, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...WHITE);
  doc.text('TOTALE REALE', 20, y+9);
  doc.setFontSize(14);
  doc.text(`€ ${Math.round(totale).toLocaleString('it-IT')},00`, 195, y+9, { align:'right' });

  doc.save(`Interno_${cliente.nome.replace(/\s/g,'_')}_${nextId}.pdf`);
}

  const [accessoInCorso, setAccessoInCorso] = useState(false);

  const [modalitaReset, setModalitaReset] = useState(false);
  const [resetEmail, setResetEmail] = useState('');
  const [resetInviato, setResetInviato] = useState(false);
  const [resetInCorso, setResetInCorso] = useState(false);
  const [erroreReset, setErroreReset] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setAccessoInCorso(true);
    setErroreAccesso('');
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setAccessoInCorso(false);
    if (error) {
      setErroreAccesso('Email o password non corrette.');
    }
    // se l'accesso riesce, App si accorge del cambio sessione da solo
  };

  const handleReset = async (e) => {
    e.preventDefault();
    setResetInCorso(true);
    setErroreReset('');
    const { error } = await sb.auth.resetPasswordForEmail(resetEmail.trim(), {
      redirectTo: window.location.href.split('#')[0],
    });
    setResetInCorso(false);
    if (error) {
      setErroreReset('Non sono riuscito a inviare l’email: ' + error.message);

  if (modalitaReset) {

              <p className="text-sm text-slate-500 leading-relaxed">

function ImpostaNuovaPasswordPage({ onCompletato }) {
  const [password, setPassword] = useState('');
  const [conferma, setConferma] = useState('');
  const [salvando, setSalvando] = useState(false);
  const [errore, setErrore] = useState('');
  const [fatto, setFatto] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setErrore('');
    if (password.length < 6) {
      setErrore('La password deve avere almeno 6 caratteri.');
      return;
    }
    if (password !== conferma) {
      setErrore('Le due password non coincidono.');
      return;
    }
    setSalvando(true);
    const { error } = await sb.auth.updateUser({ password });
    setSalvando(false);
    if (error) {
      setErrore('Non sono riuscito a salvare la password: ' + error.message);
      return;
    }
    setFatto(true);
  };

  return (
    <div className="min-h-[100dvh] lg:min-h-screen bg-[#10133a] flex flex-col">
      <div className="flex-1 flex flex-col items-center justify-center px-6 pt-[max(2rem,env(safe-area-inset-top))] pb-8 lg:pb-0">
        <img src={LOGO_BASE64} alt="Ferari Impianti" className="w-20 h-20 rounded-2xl shadow-2xl shadow-black/30 mb-5" />
        <h1 className="text-2xl font-bold text-white tracking-tight">Ferari Impianti</h1>
        <p className="text-sm text-white/60 mt-1.5">Gestionale preventivi</p>
      </div>

      <div className="bg-white rounded-t-[1.75rem] lg:rounded-2xl px-6 pt-7 pb-[max(1.75rem,env(safe-area-inset-bottom))] lg:pb-6 shadow-[0_-8px_40px_rgba(0,0,0,0.18)] lg:shadow-sm w-full max-w-sm mx-auto lg:my-auto lg:mb-8">
        {fatto ? (
          <>
            <p className="text-base font-semibold text-slate-900 mb-2">Password aggiornata</p>
            <p className="text-sm text-slate-500 leading-relaxed">La tua nuova password è attiva. Ora puoi entrare nell'app.</p>
            <button
              type="button"
              onClick={onCompletato}
              className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform"
            >
              Vai all'app
            </button>
          </>
        ) : (
          <form onSubmit={handleSubmit}>
            <p className="text-base font-semibold text-slate-900 mb-1">Scegli una nuova password</p>
            <p className="text-sm text-slate-500 mb-5">Ultimo passaggio: imposta la password che userai da ora in poi.</p>
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Nuova password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="app-input w-full px-3.5 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Conferma password</label>
                <input
                  type="password"
                  value={conferma}
                  onChange={(e) => setConferma(e.target.value)}
                  placeholder="••••••••"
                  className="app-input w-full px-3.5 py-3 text-sm bg-slate-100 border-0 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/40 transition-colors"
                  required
                />
              </div>
            </div>
            {errore && <p className="text-xs text-red-500 font-medium mt-3">{errore}</p>}
            <button
              type="submit"
              disabled={salvando}
              className="w-full mt-6 bg-[#10133a] active:scale-[0.98] text-white text-sm font-bold py-3.5 rounded-xl transition-transform disabled:opacity-60"
            >
              {salvando ? 'Salvo...' : 'Salva nuova password'}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

              <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden md:table-cell">Cantiere</th>
              <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Data</th>
              <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Importo</th>
              <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Stato</th>
              <th className="px-5 py-3"></th>
            </tr>
          </thead>
          <tbody>
            {recenti.map((p) => (
              <tr key={p.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors">
                <td className="px-5 py-3.5 font-mono text-xs text-slate-500">{p.id}</td>
                <td className="px-5 py-3.5 font-medium text-slate-900">{p.cliente}</td>
                <td className="px-5 py-3.5 text-slate-500 hidden md:table-cell">{p.cantiere}</td>
                <td className="px-5 py-3.5 text-slate-500 hidden sm:table-cell">{p.data}</td>
                <td className="px-5 py-3.5 text-right font-semibold text-slate-900">{fmtEuro(p.importo)}</td>
                <td className="px-5 py-3.5">
                  <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium ${statoStyle[p.stato]}`}>
                    {p.stato}
                  </span>
                </td>
                <td className="px-5 py-3.5 text-right">
                  <button className="text-slate-400 hover:text-slate-600">
                    <MoreHorizontal className="w-4 h-4" />
                  </button>
                </td>
              </tr>
            ))}
            {recenti.length === 0 && (
              <tr><td colSpan="7" className="px-5 py-10 text-center text-sm text-slate-400">Nessun preventivo ancora.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================ */
/* PAGINA CLIENTI — anagrafica, ricerca, scheda con storico       */
/* ============================================================ */

function ClientiPage({ clienti, setClienti, clientiLoading, preventivi, onNuovoPreventivo, onApriPreventivo }) {
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newIndirizzo, setNewIndirizzo] = useState('');
  const [newTelefono, setNewTelefono] = useState('');
  const [newGps, setNewGps] = useState(null); // { gpsLat, gpsLng, gpsMapsUrl }
  const [noteInput, setNoteInput] = useState('');
  const [salvandoCliente, setSalvandoCliente] = useState(false);
  const [erroreCliente, setErroreCliente] = useState('');
  const [fotoCliente, setFotoCliente] = useState([]);
  const [editandoInfo, setEditandoInfo] = useState(false);
  const [editIndirizzo, setEditIndirizzo] = useState('');
  const [editTelefono, setEditTelefono] = useState('');
  const [editEmail, setEditEmail] = useState('');
  const [editCodiceFiscale, setEditCodiceFiscale] = useState('');
  const [salvandoInfo, setSalvandoInfo] = useState(false);
  const [erroreInfo, setErroreInfo] = useState('');
  const [documenti, setDocumenti] = useState([]);
  const [caricandoDocumento, setCaricandoDocumento] = useState(false);
  const [erroreDocumento, setErroreDocumento] = useState('');

  const selected = clienti.find(c => c.id === selectedId);

  // tutte le foto cantiere di questo cliente, da qualsiasi preventivo
  React.useEffect(() => {
    if (!selectedId) { setFotoCliente([]); return; }
    let annullato = false;
    sb.from('foto').select('*').eq('cliente_id', selectedId).order('creato_il', { ascending: false }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setFotoCliente(data.map(fotoFromRow));
    });
    return () => { annullato = true; };
  }, [selectedId]);

  // P16: documenti e certificati allegati al cliente
  React.useEffect(() => {
    if (!selectedId) { setDocumenti([]); return; }
    let annullato = false;
    sb.from('documenti').select('*').eq('cliente_id', selectedId).order('creato_il', { ascending: false }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setDocumenti(data.map(documentoFromRow));
    });
    return () => { annullato = true; };
  }, [selectedId]);

  const caricaDocumento = async (file) => {
    if (!file || !selected) return;
    setCaricandoDocumento(true);
    setErroreDocumento('');
    try {
      if (!navigator.onLine) throw new Error('offline');
      const path = `${selected.id}/${Date.now()}-${file.name}`;
      const { error: uploadError } = await sb.storage.from('documenti-cliente').upload(path, file);
      if (uploadError) throw uploadError;
      const { data, error } = await sb.from('documenti')
        .insert(documentoToRow({ clienteId: selected.id, nome: file.name, storagePath: path }))
        .select().single();
      if (error) throw error;
      setDocumenti(prev => [documentoFromRow(data), ...prev]);
    } catch (err) {
      // niente rete: il file resta in coda e si carica da solo dopo,
      // così non si perde il lavoro fatto sul cantiere
      try {
        await accodaOffline('documento', { blob: file, nome: file.name, clienteId: selected.id });
        setDocumenti(prev => [{ id: 'offline-' + Date.now(), nome: file.name, url: null, pending: true }, ...prev]);
      } catch (e2) {
        setErroreDocumento('Errore nel caricare il documento: ' + err.message);
      }
    }
    setCaricandoDocumento(false);
  };

  const eliminaDocumento = async (doc) => {
    setDocumenti(prev => prev.filter(d => d.id !== doc.id));
    if (doc.pending) return;
    if (doc.storagePath) sb.storage.from('documenti-cliente').remove([doc.storagePath]).catch(() => {});
    sb.from('documenti').delete().eq('id', doc.id).then(({ error }) => {
      if (error) console.error('Errore nel rimuovere il documento:', error);
    });
  };

  const filtered = clienti
    .filter(c => c.nome.toLowerCase().includes(search.toLowerCase()) || c.indirizzo.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => a.nome.localeCompare(b.nome));

  const initials = (nome) => nome.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  const addCliente = async () => {
    if (!newNome.trim()) return;
    setSalvandoCliente(true);
    setErroreCliente('');
    const payload = {
      nome: newNome.trim(),
      indirizzo: newIndirizzo.trim() || 'Indirizzo da definire',
      telefono: newTelefono.trim(),
      ...(newGps || {}),
    };
    const { data, error } = await sb.from('clienti').insert(clienteToRow(payload)).select().single();
    setSalvandoCliente(false);
    if (error) {
      setErroreCliente('Errore nel salvare il cliente: ' + error.message);
      return;
    }
    const nuovo = clienteFromRow(data);
    setClienti([nuovo, ...clienti]);
    setNewNome('');
    setNewIndirizzo('');
    setNewTelefono('');
    setNewGps(null);
    setShowNewForm(false);
    setSelectedId(nuovo.id);
  };

  const aggiornaGpsCliente = async (gps) => {
    if (!selected) return;
    const { error } = await sb.from('clienti').update(clienteToRow(gps)).eq('id', selected.id);
    if (error) {
      mostraToast('Errore nel salvare la posizione: ' + error.message);
      return;
    }
    setClienti(clienti.map(c => c.id === selected.id ? { ...c, ...gps } : c));
  };

  const startEditInfo = (c) => {
    setEditIndirizzo(c.indirizzo || '');
    setEditTelefono(c.telefono || '');
    setEditEmail(c.email || '');
    setEditCodiceFiscale(c.codiceFiscale || '');
    setErroreInfo('');
    setEditandoInfo(true);
  };

  const salvaInfoCliente = async () => {
    if (!selected) return;
    setSalvandoInfo(true);
    setErroreInfo('');
    const payload = {
      indirizzo: editIndirizzo.trim() || 'Indirizzo da definire',
      telefono: editTelefono.trim(),
      email: editEmail.trim(),
      codiceFiscale: editCodiceFiscale.trim(),
    };
    const { error } = await sb.from('clienti').update(clienteToRow(payload)).eq('id', selected.id);
    setSalvandoInfo(false);
    if (error) {
      setErroreInfo('Errore nel salvare: ' + error.message);
      return;
    }
    setClienti(clienti.map(c => c.id === selected.id ? { ...c, ...payload } : c));
    setEditandoInfo(false);
  };

  const addNota = async () => {
    if (!noteInput.trim() || !selected) return;
    const d = new Date();
    const data = d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
    const nuoveNote = [...selected.note, { text: noteInput.trim(), data }];
    const { error } = await sb.from('clienti').update({ note: nuoveNote }).eq('id', selected.id);
    if (error) {
      mostraToast('Errore nel salvare la nota: ' + error.message);
      return;
    }
    setClienti(clienti.map(c => c.id === selected.id ? { ...c, note: nuoveNote } : c));
    setNoteInput('');
  };

  const storicoCliente = preventivi.filter(p => p.clienteId === selectedId);

  /* ---- vista dettaglio cliente ---- */
  if (selected) {
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 max-w-3xl">
        <button
          onClick={() => setSelectedId(null)}
          className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900"
        >
          <ArrowLeft className="w-3.5 h-3.5" />
          Torna ai clienti
        </button>

        <div className="app-card p-6">
          <div className="flex items-start justify-between flex-wrap gap-4">
            <div className="flex items-center gap-4">
              <div className="w-14 h-14 rounded-2xl bg-slate-900 flex items-center justify-center text-white font-bold text-lg shrink-0">
                {initials(selected.nome)}
              </div>
              <div>
                <h2 className="text-lg font-semibold text-slate-900 tracking-tight">{selected.nome}</h2>
                <p className="text-sm text-slate-500 mt-0.5">{selected.indirizzo}</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => startEditInfo(selected)}
                className="flex items-center gap-1.5 border border-slate-200 text-slate-500 hover:bg-slate-50 text-sm font-semibold px-3.5 py-2.5 rounded-lg transition-colors"
              >
                <Pencil className="w-3.5 h-3.5" />
                Modifica
              </button>
              <button
                onClick={() => onNuovoPreventivo(selected.id)}
                className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors"
              >
                <Plus className="w-4 h-4" />
                Nuovo Preventivo
              </button>
            </div>
          </div>

          {editandoInfo ? (
            <div className="mt-5 pt-5 border-t border-slate-100 space-y-3">
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Indirizzo cantiere</label>
                <input
                  type="text"
                  value={editIndirizzo}
                  onChange={(e) => setEditIndirizzo(e.target.value)}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Telefono</label>
                <input
                  type="tel"
                  value={editTelefono}
                  onChange={(e) => setEditTelefono(e.target.value)}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Email</label>
                <input
                  type="email"
                  value={editEmail}
                  onChange={(e) => setEditEmail(e.target.value)}
                  placeholder="nome@esempio.it"
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-500 mb-1">Codice fiscale</label>
                <input
                  type="text"
                  value={editCodiceFiscale}
                  onChange={(e) => setEditCodiceFiscale(e.target.value.toUpperCase())}
                  className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 font-mono"
                />
              </div>
              {erroreInfo && <p className="text-[11px] text-red-500">{erroreInfo}</p>}
              <div className="flex gap-2">
                <button
                  onClick={salvaInfoCliente}
                  disabled={salvandoInfo}
                  className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors disabled:opacity-60"
                >
                  {salvandoInfo ? 'Salvo...' : 'Salva'}
                </button>
                <button
                  onClick={() => setEditandoInfo(false)}
                  className="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-700"
                >
                  Annulla
                </button>
              </div>
            </div>
          ) : (selected.email || selected.codiceFiscale) && (
            <div className="mt-5 pt-5 border-t border-slate-100 grid grid-cols-2 gap-3">
              {selected.email && (
                <div>
                  <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Email</p>
                  <p className="text-sm text-slate-700 mt-0.5 truncate">{selected.email}</p>
                </div>
              )}
              {selected.codiceFiscale && (
                <div>
                  <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wide">Codice fiscale</p>
                  <p className="text-sm text-slate-700 mt-0.5 font-mono">{selected.codiceFiscale}</p>
                </div>
              )}
            </div>
          )}

          {selected.telefono && (
            <div className="flex gap-2.5 mt-5">
              <a href={`tel:${selected.telefono.replace(/\s/g, '')}`} className="flex items-center gap-2 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors">
                <Phone className="w-3.5 h-3.5" />
                Chiama
              </a>
              <a href={`https://wa.me/${selected.telefono.replace(/[^\d+]/g, '').replace('+', '')}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors">
                <MessageCircle className="w-3.5 h-3.5" />
                WhatsApp
              </a>
            </div>
          )}

          <div className="mt-5 pt-5 border-t border-slate-100">
            <GpsCapture gpsMapsUrl={selected.gpsMapsUrl} onCapture={aggiornaGpsCliente} />
          </div>
        </div>

        <div className="app-card overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100">
            <h3 className="text-sm font-semibold text-slate-900">Storico preventivi</h3>
            <p className="text-xs text-slate-400 mt-0.5">{storicoCliente.length} documenti</p>
          </div>
          {storicoCliente.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-8">Nessun preventivo ancora per questo cliente.</p>
          ) : (
            <div className="divide-y divide-slate-50">
              {storicoCliente.map(p => (
                <button
                  key={p.id}
                  type="button"
                  onClick={() => onApriPreventivo(p.id)}
                  className="w-full px-5 py-3.5 flex items-center justify-between hover:bg-slate-50/60 transition-colors text-left"
                >
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400 shrink-0">
                      <FileText className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-900">{p.id}</p>
                      <p className="text-xs text-slate-400 font-mono">{p.data}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium ${statoStyle[p.stato]}`}>{p.stato}</span>
                    <span className="text-sm font-semibold text-slate-900 w-20 text-right">{fmtEuro(p.importo)}</span>
                    <ChevronRight className="w-4 h-4 text-slate-300 shrink-0" />
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>

        {fotoCliente.length > 0 && (
          <div className="app-card overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <h3 className="text-sm font-semibold text-slate-900">Foto cantiere</h3>
              <p className="text-xs text-slate-400 mt-0.5">{fotoCliente.length} {fotoCliente.length === 1 ? 'foto' : 'foto'}, da tutti i preventivi</p>
            </div>
            <div className="p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
              {fotoCliente.map(f => (
                <div key={f.id} className="relative aspect-square rounded-lg overflow-hidden border border-slate-200">
                  <img src={f.url} alt="" className="w-full h-full object-cover" />
                  <span className={`absolute bottom-0 left-0 right-0 text-[9px] font-bold text-center py-0.5 text-white ${f.tipo === 'prima' ? 'bg-amber-500/90' : 'bg-emerald-500/90'}`}>
                    {f.tipo === 'prima' ? 'PRIMA' : 'DOPO'}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="app-card overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <div>
              <h3 className="text-sm font-semibold text-slate-900">Documenti e certificati</h3>
              <p className="text-xs text-slate-400 mt-0.5">{documenti.length} {documenti.length === 1 ? 'file' : 'file'}</p>
            </div>
            <label className={`flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-lg cursor-pointer transition-colors ${caricandoDocumento ? 'bg-slate-100 text-slate-400' : 'bg-slate-900 hover:bg-slate-800 text-white'}`}>
              {caricandoDocumento ? 'Carico...' : '+ Allega file'}
              <input
                type="file"
                className="hidden"
                disabled={caricandoDocumento}
                onChange={(e) => { if (e.target.files[0]) caricaDocumento(e.target.files[0]); e.target.value = ''; }}
              />
            </label>
          </div>
          {erroreDocumento && <p className="px-5 pt-3 text-[11px] text-red-500">{erroreDocumento}</p>}
          {documenti.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-8">Nessun documento allegato.</p>
          ) : (
            <div className="divide-y divide-slate-50">
              {documenti.map(doc => (
                <div key={doc.id} className="px-5 py-3 flex items-center justify-between gap-3">
                  {doc.pending ? (
                    <span className="text-sm text-slate-400 truncate flex items-center gap-1.5">
                      {doc.nome}
                      <span className="text-[10px] font-semibold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded-full shrink-0">in attesa</span>
                    </span>
                  ) : (
                    <a href={doc.url} target="_blank" rel="noopener noreferrer" className="text-sm text-blue-600 hover:text-blue-800 truncate">
                      {doc.nome}
                    </a>
                  )}
                  <button onClick={() => eliminaDocumento(doc)} className="text-slate-300 hover:text-red-500 shrink-0">
                    <Trash2 className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="app-card overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100">
            <h3 className="text-sm font-semibold text-slate-900">Note e comunicazioni</h3>
          </div>
          <div className="px-5 py-4 space-y-2">
            {selected.note.length === 0 && (
              <p className="text-xs text-slate-400 text-center py-3">Nessuna nota ancora.</p>
            )}
            {[...selected.note].reverse().map((n, i) => (
              <div key={i} className="bg-slate-50 border border-slate-100 rounded-lg px-3.5 py-2.5">
                <p className="text-sm text-slate-700">{n.text}</p>
                <p className="text-[11px] text-slate-400 mt-1 font-mono">{n.data}</p>
              </div>
            ))}
          </div>
          <div className="px-5 pb-4 flex gap-2">
            <input
              type="text"
              value={noteInput}
              onChange={(e) => setNoteInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addNota()}
              placeholder="Aggiungi una nota su questo cliente..."
              className="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            />
            <button onClick={addNota} className="w-10 h-10 rounded-lg bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center shrink-0">
              <Plus className="w-4 h-4" />
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---- vista lista clienti ---- */
  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="relative flex-1 min-w-[220px] max-w-sm">
          <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input
            type="text"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Cerca cliente, città..."
            className="w-full pl-9 pr-4 py-2.5 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
        </div>
        <button
          onClick={() => setShowNewForm(!showNewForm)}

/* Bottone per rilevare la posizione GPS del cliente — utile per indirizzi
   in zone rurali dove il testo dell'indirizzo non basta a trovare il posto */
function GpsCapture({ gpsMapsUrl, onCapture }) {
  const [loading, setLoading] = useState(false);
  const [errore, setErrore] = useState('');

  const prendiPosizione = () => {
    if (!navigator.geolocation) {
      setErrore('Geolocalizzazione non supportata su questo dispositivo.');
      return;
    }
    setLoading(true);
    setErrore('');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        onCapture({ gpsLat: lat, gpsLng: lng, gpsMapsUrl: `https://www.google.com/maps?q=${lat},${lng}` });
        setLoading(false);
      },
      () => {
        setErrore('Impossibile rilevare la posizione. Controlla i permessi GPS del browser.');
        setLoading(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  return (
    <div>
      <label className="block text-xs font-medium text-slate-500 mb-1">Posizione GPS (opzionale)</label>
      <div className="flex items-center gap-2 flex-wrap">
        <button
          type="button"
          onClick={prendiPosizione}
          disabled={loading}
          className="flex items-center gap-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors disabled:opacity-60"
        >
          <MapPin className="w-3.5 h-3.5" />
          {loading ? 'Rilevo posizione...' : gpsMapsUrl ? 'Aggiorna posizione' : 'Prendi posizione'}
        </button>
        {gpsMapsUrl && (
          <a href={gpsMapsUrl} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-blue-600 hover:text-blue-700">
            Apri in Maps
          </a>
        )}
      </div>
      {errore && <p className="text-[11px] text-red-500 mt-1.5">{errore}</p>}
    </div>
  );
}

/* ============================================================
   GOOGLE CALENDAR — pulsante isolato e opzionale (Fase 7). Se il
   Client ID non è configurato, questo componente non renderizza
   nulla: nessun impatto sul resto dell'app.
   ============================================================ */
function GoogleCalendarButton({ titolo, luogo, descrizione }) {
  const oraDefault = () => {
    const d = new Date();
    d.setMinutes(0, 0, 0);
    d.setHours(d.getHours() + 1);
    return d;
  };
  const [aperto, setAperto] = useState(false);
  const [data, setData] = useState(() => oraDefault().toISOString().slice(0, 10));
  const [ora, setOra] = useState(() => oraDefault().toISOString().slice(11, 16));
  const [salvando, setSalvando] = useState(false);
  const [esito, setEsito] = useState(null); // { tipo: 'ok'|'err', testo }

  if (!googleCalendarDisponibile()) return null;

  const conferma = async () => {
    setSalvando(true);
    setEsito(null);
    try {
      await creaEventoGoogleCalendar({
        titolo, luogo, descrizione,
        dataOraInizio: `${data}T${ora}:00`,
      });
      setEsito({ tipo: 'ok', testo: 'Aggiunto al tuo Google Calendar.' });
      setAperto(false);
    } catch (err) {
      setEsito({ tipo: 'err', testo: 'Non riuscito, riprova.' });
    }
    setSalvando(false);
  };

  return (
    <div>
      {!aperto ? (
        <button
          onClick={() => { setAperto(true); setEsito(null); }}
          className="w-full border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
        >
          <CalendarIcon className="w-4 h-4" />
          Aggiungi a Google Calendar
        </button>
      ) : (
        <div className="app-card p-4 space-y-3">
          <p className="text-sm font-semibold text-slate-900">Quando?</p>
          <div className="flex gap-2">
            <input
              type="date"
              value={data}
              onChange={(e) => setData(e.target.value)}
              className="flex-1 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30"
            />
            <input
              type="time"
              value={ora}
              onChange={(e) => setOra(e.target.value)}
              className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30"
            />
          </div>
          <div className="flex gap-2">
            <button
              onClick={conferma}
              disabled={salvando}
              className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors disabled:opacity-60"
            >
              {salvando ? 'Aggiungo...' : 'Conferma'}
            </button>
            <button onClick={() => setAperto(false)} className="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-700">
              Annulla
            </button>
          </div>
        </div>
      )}
      {esito && (
        <p className={`text-[11px] mt-1.5 ${esito.tipo === 'ok' ? 'text-emerald-600' : 'text-red-500'}`}>{esito.testo}</p>
      )}
    </div>
  );
}
