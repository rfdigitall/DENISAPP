function loadJsPDF() {
  return new Promise((resolve, reject) => {
    if (window.jspdf) { resolve(window.jspdf.jsPDF); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => resolve(window.jspdf.jsPDF);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function generaPDFCliente({ cliente, carrello, rincaro, totale, nextId, logoB64 }) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

  addHeaderCliente(doc, logoB64, nextId);

  let y = 74;

  // anteprima cliente
  doc.setFillColor(243, 244, 246);
  doc.roundedRect(12, y, 186, 20, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...SLATE5);
  doc.text('CLIENTE', 20, y+5);
  doc.text('CANTIERE', 110, y+5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...SLATE9);
  doc.text(cliente.nome, 20, y+13);
  doc.text(cliente.indirizzo, 110, y+13);
  y += 26;

  // sezione DISEGNAZIONE LAVORI
  doc.setFillColor(...NAVY);
  doc.roundedRect(12, y, 186, 8, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...WHITE);
  doc.text('DISEGNAZIONE LAVORI', 20, y+5.5);
  y += 13;

  const materiali = carrello.filter(i => i.kind === 'materiale');
  const prodotti  = carrello.filter(i => i.kind === 'prodotto');

  if (materiali.length > 0) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...SLATE9);
    doc.text('MATERIALI E POSA IN OPERA', 12, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(80, 85, 92);
    materiali.forEach(item => {
      const line = `• Fornitura e posa in opera di ${item.nome.toLowerCase()}.`;
      const lines = doc.splitTextToSize(line, 182);
      doc.text(lines, 15, y);
      y += lines.length * 4.5;
    });
    y += 3;
  }

  if (prodotti.length > 0) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...SLATE9);
    doc.text('PRODOTTI E FINITURE SELEZIONATE', 12, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(80, 85, 92);
    for (const item of prodotti) {
      const imgX = 15;
      if (item.img && item.img.startsWith('data:')) {
        try { doc.addImage(item.img, 'JPEG', imgX, y-3, 12, 9, '', 'FAST'); } catch(e) {}
        const line = `Fornitura e installazione: ${item.nome} (${item.meta}).`;
        const lines = doc.splitTextToSize(line, 164);
        doc.text(lines, imgX+14, y+2);
        y += Math.max(lines.length * 4.5, 10);
      } else {
        const line = `• Fornitura e installazione: ${item.nome} (${item.meta}).`;
        const lines = doc.splitTextToSize(line, 182);
        doc.text(lines, 15, y);
        y += lines.length * 4.5;
      }
    }
    y += 3;
  }

  if (rincaro > 0) {
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
    doc.text('Manodopera e collaudo finale inclusi nel totale.', 12, y); y += 8;
  }

  // IVA non esposta
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
  doc.text('IVA NON ESPOSTA', 105, y, { align:'center' }); y += 6;

  // box totale
  doc.setFillColor(...NAVY);
  doc.roundedRect(12, y, 186, 16, 3, 3, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...WHITE);
  doc.text('TOTALE', 20, y+10);
  doc.setFontSize(16);
  doc.text(`€ ${Math.round(totale).toLocaleString('it-IT')},00`, 198, y+10, { align:'right' });
  y += 22;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...SLATE5);
  doc.text('Il totale comprende materiale e manodopera', 105, y, { align:'center' });

  addFooterCliente(doc);
  doc.save(`Preventivo_${cliente.nome.replace(/\s/g,'_')}_${nextId}.pdf`);
}

async function generaPDFInterno({ cliente, carrello, subMat, subProd, rincaro, totale, rincaroMode, rPct, rOre, rTar, nextId }) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

  // Header interno — sfondo grigio scuro
  doc.setFillColor(...SLATE9);
  doc.rect(0, 0, 210, 22, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...WHITE);
  doc.text('LISTA MATERIALI DA ORDINARE', 12, 10);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(180, 185, 190);
  doc.text('USO INTERNO — NON INVIARE AL CLIENTE', 12, 16);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...WHITE);
  doc.text(nextId, 198, 10, { align:'right' });
  doc.text(oggiData(), 198, 16, { align:'right' });

  let y = 30;

  // info cliente
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...SLATE9);
  doc.text(`Cliente: ${cliente.nome}`, 12, y);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(...SLATE5);
  doc.text(`Cantiere: ${cliente.indirizzo}`, 12, y+5);
  y += 12;

  // intestazione tabella
  doc.setFillColor(243, 244, 246);
  doc.rect(12, y, 186, 7, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...SLATE5);
  doc.text('MATERIALE', 15, y+5);
  doc.text('QTÀ / UNITÀ', 105, y+5);
  doc.text('P. UNITARIO', 145, y+5);
  doc.text('TOTALE', 195, y+5, { align:'right' });
  y += 10;

  // righe materiali
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  carrello.forEach((item, i) => {
    if (i % 2 === 1) { doc.setFillColor(249,250,251); doc.rect(12, y-4, 186, 7, 'F'); }
    doc.setTextColor(...SLATE9);
    doc.text(item.nome, 15, y);
    doc.setTextColor(...SLATE5);
    doc.text(item.meta, 105, y);
    doc.text(fmtEuro2(item.prezzoUnitario), 145, y);
    doc.setFont('helvetica','bold'); doc.setTextColor(...SLATE9);
    doc.text(fmtEuro2(item.prezzoUnitario * item.qty), 195, y, { align:'right' });
    doc.setFont('helvetica','normal');
    y += 7;
  });

  if (carrello.length === 0) {
    doc.setTextColor(...SLATE5);
    doc.text('Nessuna voce aggiunta.', 105, y, { align:'center' });
    y += 7;
  }

  y += 3;
  // linea separatrice
  doc.setDrawColor(...SLATE3); doc.setLineWidth(0.3);
  doc.line(12, y, 198, y); y += 5;

  // subtotali
  const rows = [
    ['Subtotale materiali + prodotti', fmtEuro2(subMat + subProd)],
    [rincaroMode === 'percent' ? `Manodopera (${rPct}% sui materiali)` : `Manodopera (${rOre}h × ${rTar} €/h)`, fmtEuro2(rincaro)],
  ];
  rows.forEach(([label, value]) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SLATE5);
    doc.text(label, 15, y);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...SLATE9);
    doc.text(value, 195, y, { align:'right' });
    y += 7;
  });

  y += 2;
  // box totale reale
  doc.setFillColor(...SLATE9);
  doc.roundedRect(12, y, 186, 14, 2, 2, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...WHITE);
  doc.text('TOTALE REALE', 20, y+9);
  doc.setFontSize(14);
  doc.text(`€ ${Math.round(totale).toLocaleString('it-IT')},00`, 195, y+9, { align:'right' });

  doc.save(`Interno_${cliente.nome.replace(/\s/g,'_')}_${nextId}.pdf`);
}

/* PAGINA CLIENTI — anagrafica, ricerca, scheda con storico       */

function ClientiPage({ clienti, setClienti, preventivi, onNuovoPreventivo }) {
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newIndirizzo, setNewIndirizzo] = useState('');
  const [newTelefono, setNewTelefono] = useState('');
  const [noteInput, setNoteInput] = useState('');

  const selected = clienti.find(c => c.id === selectedId);

  const filtered = clienti
    .filter(c => c.nome.toLowerCase().includes(search.toLowerCase()) || c.indirizzo.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => a.nome.localeCompare(b.nome));

  const initials = (nome) => nome.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  const addCliente = () => {
    if (!newNome.trim()) return;
    const nuovo = {
      id: 'c' + Date.now(),
      nome: newNome.trim(),
      indirizzo: newIndirizzo.trim() || 'Indirizzo da definire',
      telefono: newTelefono.trim(),
      note: [],
    };
    setClienti([nuovo, ...clienti]);
    setNewNome('');
    setNewIndirizzo('');
    setNewTelefono('');
    setShowNewForm(false);
    setSelectedId(nuovo.id);
  };

  const addNota = () => {
    if (!noteInput.trim() || !selected) return;
    const d = new Date();
    const data = d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
    setClienti(clienti.map(c => c.id === selected.id
      ? { ...c, note: [...c.note, { text: noteInput.trim(), data }] }
      : c
    ));
    setNoteInput('');
  };

  const storicoCliente = preventivi.filter(p => p.clienteId === selectedId);

  /* ---- vista dettaglio cliente ---- */
  if (selected) {
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 max-w-3xl">
        <button
          onClick={() => setSelectedId(null)}
          className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900"
        >
          <ArrowLeft className="w-3.5 h-3.5" />
          Torna ai clienti
        </button>

        <div className="bg-white border border-slate-200 rounded-2xl p-6">
          <div className="flex items-start justify-between flex-wrap gap-4">
            <div className="flex items-center gap-4">
              <div className="w-14 h-14 rounded-2xl bg-slate-900 flex items-center justify-center text-white font-bold text-lg shrink-0">
                {initials(selected.nome)}
              </div>
              <div>
                <h2 className="text-lg font-semibold text-slate-900 tracking-tight">{selected.nome}</h2>
                <p className="text-sm text-slate-500 mt-0.5">{selected.indirizzo}</p>
              </div>
            </div>
            <button
              onClick={() => onNuovoPreventivo(selected.id)}
              className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors"
            >
              <Plus className="w-4 h-4" />
              Nuovo Preventivo
            </button>
          </div>

          {selected.telefono && (
            <div className="flex gap-2.5 mt-5">
              <a href={`tel:${selected.telefono.replace(/\s/g, '')}`} className="flex items-center gap-2 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors">
                <Phone className="w-3.5 h-3.5" />
                Chiama
              </a>
              <a href={`https://wa.me/${selected.telefono.replace(/[^\d+]/g, '').replace('+', '')}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors">
                <MessageCircle className="w-3.5 h-3.5" />
                WhatsApp
              </a>
            </div>
          )}
        </div>

        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100">
            <h3 className="text-sm font-semibold text-slate-900">Storico preventivi</h3>
            <p className="text-xs text-slate-400 mt-0.5">{storicoCliente.length} documenti</p>
          </div>
          {storicoCliente.length === 0 ? (
            <p className="text-sm text-slate-400 text-center py-8">Nessun preventivo ancora per questo cliente.</p>
          ) : (
            <div className="divide-y divide-slate-50">
              {storicoCliente.map(p => (
                <div key={p.id} className="px-5 py-3.5 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400 shrink-0">
                      <FileText className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-900">{p.id}</p>
                      <p className="text-xs text-slate-400 font-mono">{p.data}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium ${statoStyle[p.stato]}`}>{p.stato}</span>
                    <span className="text-sm font-semibold text-slate-900 w-20 text-right">{fmtEuro(p.importo)}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <div className="px-5 py-4 border-b border-slate-100">
            <h3 className="text-sm font-semibold text-slate-900">Note e comunicazioni</h3>
          </div>
          <div className="px-5 py-4 space-y-2">
            {selected.note.length === 0 && (
              <p className="text-xs text-slate-400 text-center py-3">Nessuna nota ancora.</p>
            )}
            {[...selected.note].reverse().map((n, i) => (
              <div key={i} className="bg-slate-50 border border-slate-100 rounded-lg px-3.5 py-2.5">
                <p className="text-sm text-slate-700">{n.text}</p>
                <p className="text-[11px] text-slate-400 mt-1 font-mono">{n.data}</p>
              </div>
            ))}
          </div>
          <div className="px-5 pb-4 flex gap-2">
            <input
              type="text"
              value={noteInput}
              onChange={(e) => setNoteInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addNota()}
              placeholder="Aggiungi una nota su questo cliente..."
              className="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            />
            <button onClick={addNota} className="w-10 h-10 rounded-lg bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center shrink-0">
              <Plus className="w-4 h-4" />
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---- vista lista clienti ---- */
  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="relative flex-1 min-w-[220px] max-w-sm">
          <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
          <input
            type="text"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Cerca cliente, città..."
            className="w-full pl-9 pr-4 py-2.5 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
        </div>
        <button
          onClick={() => setShowNewForm(!showNewForm)}
          className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2.5 rounded-lg transition-colors"
        >
          <Plus className="w-3.5 h-3.5" />
          Nuovo cliente
        </button>
      </div>

      {showNewForm && (
        <div className="bg-white border border-slate-200 rounded-2xl p-4">
          <p className="text-xs font-semibold text-slate-500 mb-3">Nuovo cliente</p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <input
              type="text"
              value={newNome}
              onChange={(e) => setNewNome(e.target.value)}
              placeholder="Nome e cognome"
              className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            />
            <input
              type="text"
              value={newIndirizzo}
              onChange={(e) => setNewIndirizzo(e.target.value)}
              placeholder="Indirizzo cantiere"
              className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            />
            <input
              type="text"
              value={newTelefono}
              onChange={(e) => setNewTelefono(e.target.value)}
              placeholder="Telefono"
              className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            />
          </div>
          <div className="flex gap-2 mt-3">
            <button onClick={addCliente} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors">
              Salva cliente
            </button>
            <button onClick={() => setShowNewForm(false)} className="px-3 py-2 text-slate-400 hover:text-slate-600 text-sm">
              Annulla
            </button>
          </div>
        </div>
      )}

      <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
        <div className="divide-y divide-slate-50">
          {filtered.map(c => {
            const docCount = preventivi.filter(p => p.clienteId === c.id).length;
            return (
              <button
                key={c.id}
                onClick={() => setSelectedId(c.id)}
                className="w-full flex items-center gap-3.5 px-5 py-3.5 text-left hover:bg-slate-50/60 transition-colors"
              >
                <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-semibold text-slate-600 text-xs shrink-0">
                  {initials(c.nome)}
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-sm font-medium text-slate-900 truncate">{c.nome}</p>
                  <p className="text-xs text-slate-400 truncate mt-0.5">{c.indirizzo}</p>
                </div>
                <div className="text-right shrink-0 hidden sm:block">
                  <p className="text-xs text-slate-400">{docCount} {docCount === 1 ? 'preventivo' : 'preventivi'}</p>
                </div>
                <ChevronRight className="w-4 h-4 text-slate-300 shrink-0" />
              </button>
            );
          })}
          {filtered.length === 0 && (
            <p className="text-sm text-slate-400 text-center py-10">Nessun cliente trovato.</p>
          )}
        </div>
      </div>
    </div>
  );
}

/* NUOVO CLIENTE INLINE — usato dentro il form preventivo        */
/* ============================================================ */
function NuovoClienteInline({ onSalva }) {
  const [aperto, setAperto] = useState(false);
  const [nome, setNome] = useState('');
  const [indirizzo, setIndirizzo] = useState('');
  const [telefono, setTelefono] = useState('');

  const salva = () => {
    if (!nome.trim()) return;
    onSalva({
      nome: nome.trim(),
      indirizzo: indirizzo.trim() || 'Indirizzo da definire',
      telefono: telefono.trim(),
    });
    setNome(''); setIndirizzo(''); setTelefono('');
    setAperto(false);
  };

  if (!aperto) {
    return (
      <button
        onClick={() => setAperto(true)}
        className="w-full flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 hover:border-blue-400 hover:bg-blue-50/50 text-slate-500 hover:text-blue-600 text-sm font-medium py-4 rounded-2xl transition-colors"
      >
        <Plus className="w-4 h-4" />
        Aggiungi nuovo cliente
      </button>
    );
  }

  return (
    <div className="bg-white border border-slate-200 rounded-2xl p-6">
      <div className="flex items-center justify-between mb-4">
        <p className="text-sm font-semibold text-slate-900">Nuovo cliente</p>
        <button onClick={() => setAperto(false)} className="text-slate-400 hover:text-slate-600">
          <X className="w-4 h-4" />
        </button>
      </div>
      <div className="space-y-3">
        <div>
          <label className="block text-xs font-medium text-slate-500 mb-1">Nome e cognome *</label>
          <input
            type="text"
            value={nome}
            onChange={e => setNome(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && salva()}
            placeholder="Es. Giuseppe Martini"
            className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            autoFocus
          />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-500 mb-1">Indirizzo cantiere</label>
          <input
            type="text"
            value={indirizzo}
            onChange={e => setIndirizzo(e.target.value)}
            placeholder="Es. Via Mazzini 8, Bologna"
            className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-500 mb-1">Telefono</label>
          <input
            type="tel"
            value={telefono}
            onChange={e => setTelefono(e.target.value)}
            placeholder="+39 333 1234567"
            className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
        </div>
      </div>
      <div className="flex gap-2 mt-4">
        <button
          onClick={salva}
          className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors"
        >
          Salva e usa questo cliente
        </button>
        <button
          onClick={() => setAperto(false)}
          className="px-4 py-2.5 text-sm text-slate-500 hover:text-slate-700"
        >
          Annulla
        </button>
      </div>
    </div>
  );
}

/* ============================================================ */
/* PREVENTIVI PAGE                                               */
/* ============================================================ */
function PreventiviPage({ clienti, setClienti, preventivi, setPreventivi, materiali, setMateriali, prodotti, presetClienteId, onConsumePreset }) {
  const [mode, setMode] = useState('lista'); // 'lista' | 'nuovo' | 'dettaglio'
  const [clienteId, setClienteId] = useState(null);
  const [statoEditId, setStatoEditId] = useState(null); // id preventivo in cambio stato
  const [dettaglioId, setDettaglioId] = useState(null);

  // helper per aggiornare clienti dal form inline
  const setClientiEsterni = setClienti;
  const [carrello, setCarrello] = useState([]); // { id, nome, meta, prezzoUnitario, qty, kind }
  const [rincaroMode, setRincaroMode] = useState('percent');
  const [rincaroPercent, setRincaroPercent] = useState('10');
  const [rincaroOre, setRincaroOre] = useState('8');
  const [rincaroTariffa, setRincaroTariffa] = useState('35');
  const [activeCat, setActiveCat] = useState('Caldaie & Clima');
  const [savedFlashId, setSavedFlashId] = useState(null);
  const [showPreview, setShowPreview] = useState(false);
  const [previewView, setPreviewView] = useState('cliente'); // 'cliente' | 'interno'
  const [showSuccess, setShowSuccess] = useState(false);
  const [zonaAttiva, setZonaAttiva] = useState('generico');
  const [fotoCantiere, setFotoCantiere] = useState([]); // { id, dataUrl, tipo: 'prima'|'dopo', zona }

  // apre direttamente il flusso "nuovo" se arriviamo da una scheda cliente
  React.useEffect(() => {
    if (presetClienteId) {
      setClienteId(presetClienteId);
      setCarrello([]);
      setMode('nuovo');
      onConsumePreset();
    }
  }, [presetClienteId]);

  const cliente = clienti.find(c => c.id === clienteId);

  const subtotaleMateriali = carrello.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleProdotti = carrello.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const rincaroValore = rincaroMode === 'percent'
    ? subtotaleMateriali * ((parseFloat(rincaroPercent) || 0) / 100)
    : (parseFloat(rincaroOre) || 0) * (parseFloat(rincaroTariffa) || 0);
  const totale = subtotaleMateriali + subtotaleProdotti + rincaroValore;

  const startNuovo = () => {
    setClienteId(null);
    setCarrello([]);
    setRincaroMode('percent');
    setRincaroPercent('10');
    setRincaroOre('8');
    setRincaroTariffa('35');
    setZonaAttiva('generico');
    setFotoCantiere([]);
    setMode('nuovo');
  };

  const aggiornaPrezzoMateriale = (matId, valoreStr) => {
    const valore = parseFloat(valoreStr.replace(',', '.'));
    setMateriali(materiali.map(m => m.id === matId ? { ...m, prezzo: isNaN(valore) ? m.prezzo : valore } : m));
    if (!isNaN(valore) && valore > 0) {
      const mat = materiali.find(m => m.id === matId);
      setCarrello(prev => {
        const exists = prev.find(i => i.id === matId);
        const qty = exists ? exists.qty : 1;
        const nuovaVoce = { id: matId, nome: mat.nome, meta: `${qty} ${mat.unita} × ${valore.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`, prezzoUnitario: valore, qty, kind: 'materiale', zona: exists?.zona || zonaAttiva };
        if (exists) return prev.map(i => i.id === matId ? nuovaVoce : i);
        return [...prev, nuovaVoce];
      });
      setSavedFlashId(matId);
      setTimeout(() => setSavedFlashId(null), 1500);
    } else if (valoreStr === '') {
      setCarrello(prev => prev.filter(i => i.id !== matId));
    }
  };

  const aggiornaQtyMateriale = (matId, qty) => {
    const mat = materiali.find(m => m.id === matId);
    setCarrello(prev => prev.map(i => i.id === matId
      ? { ...i, qty, meta: `${qty} ${mat.unita} × ${i.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` }
      : i
    ));
  };

  const toggleProdotto = (p) => {
    const exists = carrello.find(i => i.id === p.id);
    if (exists) {
      setCarrello(carrello.filter(i => i.id !== p.id));
    } else {
      setCarrello([...carrello, { id: p.id, nome: p.nome, meta: p.tier, prezzoUnitario: p.prezzo, qty: 1, kind: 'prodotto', zona: zonaAttiva }]);
    }
  };

  // Applica un template di lavoro — aggiunge automaticamente i materiali tipici,
  // così non si devono cercarli uno per uno per i lavori più comuni
  const applicaTemplate = (template) => {
    setZonaAttiva(template.zona);
    template.materiali.forEach(tm => {
      const matEsistente = materiali.find(m => m.nome === tm.nome);
      const matId = matEsistente ? matEsistente.id : 'tmp-' + tm.nome.replace(/\s/g, '');
      if (!matEsistente) {
        setMateriali(prevMat => [...prevMat, { id: matId, nome: tm.nome, unita: tm.unita, prezzo: tm.prezzo, ultimoAggiornamento: oggiStr() }]);
      }
      setCarrello(prev => {
        const exists = prev.find(i => i.id === matId);
        if (exists) return prev;
        return [...prev, {
          id: matId, nome: tm.nome,
          meta: `${tm.qty} ${tm.unita} × ${tm.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`,
          prezzoUnitario: tm.prezzo, qty: tm.qty, kind: 'materiale', zona: template.zona,
        }];
      });
    });
    if (template.prodottoSuggerito) {
      const prod = prodotti.find(p => p.id === template.prodottoSuggerito);
      if (prod) {
        setCarrello(prev => {
          if (prev.find(i => i.id === prod.id)) return prev;
          return [...prev, { id: prod.id, nome: prod.nome, meta: prod.tier, prezzoUnitario: prod.prezzo, qty: 1, kind: 'prodotto', zona: template.zona }];
        });
      }
    }
  };

  // Gestione foto cantiere — simulata in locale (base64), l'app richiede
  // almeno 2 foto prima di poter salvare il preventivo come richiesto
  const gestisciFoto = (fileList, tipo) => {
    Array.from(fileList).forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        setFotoCantiere(prev => [...prev, { id: 'f' + Date.now() + Math.random(), dataUrl: e.target.result, tipo, zona: zonaAttiva }]);
      };
      reader.readAsDataURL(file);
    });
  };

  const rimuoviFoto = (id) => setFotoCantiere(prev => prev.filter(f => f.id !== id));

  const rimuoviVoce = (id) => setCarrello(carrello.filter(i => i.id !== id));

  const cambiaStato = (id, nuovoStato) => {
    setPreventivi(preventivi.map(p => p.id === id ? { ...p, stato: nuovoStato } : p));
    setStatoEditId(null);
  };

  const maxNum = Math.max(...preventivi.map(p => parseInt(p.id.replace('PV-', '')) || 0), 148);
  const numeroDocumento = 'PV-' + String(maxNum + 1).padStart(4, '0');
  const dataDocumento = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const salvaPreventivo = () => {
    if (!cliente || carrello.length === 0) return;
    const zoneCoinvolte = [...new Set(carrello.map(i => i.zona || 'generico'))];
    const nuovo = {
      id: numeroDocumento,
      clienteId: cliente.id,
      cliente: cliente.nome,
      cantiere: cliente.indirizzo.split(',').pop().trim(),
      data: new Date().toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' }),
      importo: Math.round(totale),
      stato: 'In Attesa',
      zone: zoneCoinvolte,
      nFoto: fotoCantiere.length,
      carrelloSnapshot: carrello,
    };
    setPreventivi([nuovo, ...preventivi]);
    setShowPreview(false);
    setShowSuccess(true);
  };

  const chiudiSuccess = () => {
    setShowSuccess(false);
    setMode('lista');
  };

  /* ---- vista lista ---- */
  if (mode === 'lista') {
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">
        <div className="flex items-center justify-end">
          <button
            onClick={startNuovo}
            className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors"
          >
            <Plus className="w-4 h-4" />
            Nuovo Preventivo
          </button>
        </div>

        <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-slate-100">
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">N. Documento</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Cliente</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden md:table-cell">Cantiere</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Data</th>
                  <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Importo</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Stato</th>
                </tr>
              </thead>
              <tbody>
                {preventivi.map((p) => (
                  <tr
                    key={p.id}
                    onClick={() => { setDettaglioId(p.id); setMode('dettaglio'); }}
                    className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors cursor-pointer"
                  >
                    <td className="px-5 py-3.5 font-mono text-xs text-slate-500">{p.id}</td>
                    <td className="px-5 py-3.5 font-medium text-slate-900">{p.cliente}</td>
                    <td className="px-5 py-3.5 text-slate-500 hidden md:table-cell">{p.cantiere}</td>
                    <td className="px-5 py-3.5 text-slate-500 hidden sm:table-cell">{p.data}</td>
                    <td className="px-5 py-3.5 text-right font-semibold text-slate-900">{fmtEuro(p.importo)}</td>
                    <td className="px-5 py-3.5" onClick={(e) => e.stopPropagation()}>
                      {statoEditId === p.id ? (
                        <div className="flex items-center gap-1 flex-wrap">
                          {['In Attesa', 'Accettato', 'Inviato', 'Rifiutato'].map(s => (
                            <button
                              key={s}
                              onClick={() => cambiaStato(p.id, s)}
                              className={`px-2 py-1 rounded-full text-[10px] font-semibold border transition-opacity hover:opacity-80 ${statoStyle[s] || 'bg-red-50 text-red-600 ring-1 ring-red-400/30'}`}
                            >
                              {s}
                            </button>
                          ))}
                          <button onClick={() => setStatoEditId(null)} className="text-slate-400 hover:text-slate-600 ml-1">
                            <X className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ) : (
                        <button
                          onClick={() => setStatoEditId(p.id)}
                          className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium hover:opacity-75 transition-opacity ${statoStyle[p.stato] || 'bg-red-50 text-red-600 ring-1 ring-red-400/30'}`}
                        >
                          {p.stato}
                          <Pencil className="w-2.5 h-2.5 opacity-60" />
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
                {preventivi.length === 0 && (
                  <tr><td colSpan="6" className="px-5 py-10 text-center text-sm text-slate-400">Nessun preventivo ancora.</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

  /* ---- vista dettaglio preventivo esistente ---- */
  if (mode === 'dettaglio') {
    const p = preventivi.find(pv => pv.id === dettaglioId);
    const clienteDett = p ? clienti.find(c => c.id === p.clienteId) : null;
    const carrelloDett = p?.carrelloSnapshot || [];
    const rincaroDett = p?.importo && carrelloDett.length
      ? p.importo - carrelloDett.reduce((s, i) => s + i.prezzoUnitario * i.qty, 0)
      : 0;
    if (!p) { setMode('lista'); return null; }
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 max-w-3xl">
        <button onClick={() => setMode('lista')} className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900">
          <ArrowLeft className="w-3.5 h-3.5" />
          Torna ai preventivi
        </button>

        <div className="bg-white border border-slate-200 rounded-2xl px-6 py-5 flex items-center justify-between flex-wrap gap-3">
          <div>
            <p className="font-mono text-xs text-slate-400">{p.id}</p>
            <p className="text-lg font-bold text-slate-900 mt-0.5">{clienteDett?.nome || p.cliente}</p>
            <p className="text-sm text-slate-500 mt-0.5">{clienteDett?.indirizzo || p.cantiere} · {p.data}</p>
          </div>
          <div className="text-right">
            <p className="text-2xl font-bold text-slate-900">{fmtEuro(p.importo)}</p>
            <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium mt-1 ${statoStyle[p.stato] || 'bg-red-50 text-red-600'}`}>{p.stato}</span>
          </div>
        </div>

        {(p.zone || []).length > 0 && (
          <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <p className="text-sm font-semibold text-slate-900">Lavorazioni per zona</p>
            </div>
            <div className="p-5 space-y-4">
              {p.zone.map(zonaId => {
                const zonaInfo = ZONE_AMBIENTI.find(z => z.id === zonaId);
                const vociZona = carrelloDett.filter(i => (i.zona || 'generico') === zonaId);
                return (
                  <div key={zonaId}>
                    <p className="text-sm font-bold text-slate-800 flex items-center gap-2 mb-1.5">
                      <ZonaIcon zonaId={zonaInfo?.id || zonaId} className="text-slate-500 shrink-0" size={16} />
                      {zonaInfo?.nome || zonaId}
                    </p>
                    <ul className="space-y-1">
                      {vociZona.map(v => (
                        <li key={v.id} className="text-sm text-slate-600 flex items-center justify-between">
                          <span>{v.nome} <span className="text-slate-400 font-mono text-xs">({v.meta})</span></span>
                          <span className="font-semibold text-slate-900">{fmtEuro(Math.round(v.prezzoUnitario * v.qty))}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {p.nFoto > 0 && (
          <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <p className="text-sm font-semibold text-slate-900">Foto cantiere ({p.nFoto})</p>
            </div>
            <div className="p-5 text-sm text-slate-400">
              Le foto sono archiviate con questo preventivo.
            </div>
          </div>
        )}

        <div className="flex flex-col sm:flex-row gap-2.5">
          <button
            onClick={async () => {
              if (!clienteDett) return;
              await generaPDFCliente({ cliente: clienteDett, carrello: carrelloDett, rincaro: rincaroDett, totale: p.importo, nextId: p.id, logoB64: LOGO_BASE64 });
            }}
            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
          >
            <Download className="w-4 h-4" />
            PDF per il Cliente
          </button>
          <button
            onClick={async () => {
              if (!clienteDett) return;
              const subMat = carrelloDett.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
              const subProd = carrelloDett.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
              await generaPDFInterno({ cliente: clienteDett, carrello: carrelloDett, subMat, subProd, rincaro: rincaroDett, totale: p.importo, rincaroMode: 'percent', rPct: '10', rOre: '8', rTar: '35', nextId: p.id });
            }}
            className="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
          >
            <Download className="w-4 h-4" />
            PDF Interno
          </button>
        </div>
      </div>
    );
  }

  /* ---- vista creazione nuovo preventivo ---- */
  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 pb-4">
      <button onClick={() => setMode('lista')} className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 mb-5">
        <ArrowLeft className="w-3.5 h-3.5" />
        Torna ai preventivi
      </button>

      {!cliente ? (
        <div className="max-w-lg space-y-4">
          {/* Selezione cliente esistente */}
          <div className="bg-white border border-slate-200 rounded-2xl p-6">
            <p className="text-sm font-semibold text-slate-900 mb-1">Seleziona il cliente</p>
            <p className="text-xs text-slate-400 mb-4">Per quale cliente stai preparando questo preventivo?</p>
            <select
              value={clienteId || ''}
              onChange={(e) => { if (e.target.value) setClienteId(e.target.value); }}
              className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
            >
              <option value="">Scegli un cliente esistente...</option>
              {clienti.map(c => <option key={c.id} value={c.id}>{c.nome} — {c.indirizzo}</option>)}
            </select>
          </div>

          {/* Separatore */}
          <div className="flex items-center gap-3">
            <div className="flex-1 h-px bg-slate-200"></div>
            <span className="text-xs text-slate-400 font-medium">oppure</span>
            <div className="flex-1 h-px bg-slate-200"></div>
          </div>

          {/* Nuovo cliente inline */}
          <NuovoClienteInline
            onSalva={(nuovoCliente) => {
              const c = { id: 'c' + Date.now(), ...nuovoCliente, note: [] };
              setClientiEsterni(prev => [c, ...prev]);
              setClienteId(c.id);
            }}
          />
        </div>
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-5 items-start">

          <div className="space-y-5 min-w-0">

            <div className="bg-white border border-slate-200 rounded-2xl px-5 py-4">
              <p className="text-[11px] text-slate-400 uppercase tracking-wide font-semibold">Preventivo per</p>
              <p className="text-sm font-bold text-slate-900 mt-0.5">{cliente.nome} · {cliente.indirizzo}</p>
            </div>

            {/* zona / ambiente attivo */}
            <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
              <div className="px-4 sm:px-5 py-3.5 border-b border-slate-100">
                <p className="text-sm font-semibold text-slate-900">Zona di lavoro</p>
                <p className="text-xs text-slate-400 mt-0.5">Seleziona l&apos;ambiente in cui stai lavorando</p>
              </div>
              <div className="p-3 sm:p-4">
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-2.5">
                  {ZONE_AMBIENTI.map(function (z) {
                    const Icon = z.Icon;
                    const active = zonaAttiva === z.id;
                    return (
                      <button
                        key={z.id}
                        type="button"
                        onClick={() => setZonaAttiva(z.id)}
                        className={`flex flex-col items-start gap-2.5 p-3 rounded-xl border text-left transition-all min-h-[88px] ${
                          active
                            ? 'border-slate-900 bg-slate-900 text-white shadow-sm ring-1 ring-slate-900/10'
                            : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-50 active:scale-[0.98]'
                        }`}
                      >
                        <span className={`flex h-8 w-8 items-center justify-center rounded-lg ${active ? 'bg-white/15' : 'bg-slate-100'}`}>
                          <Icon className={`w-4 h-4 ${active ? 'text-white' : 'text-slate-600'}`} />
                        </span>
                        <span className="text-[11px] sm:text-xs font-semibold leading-snug pr-1">{z.nome}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {TEMPLATE_LAVORI.filter(t => t.zona === zonaAttiva).length > 0 && (
                <div className="px-3 sm:px-4 pb-4 border-t border-slate-100 pt-3">
                  <p className="text-[10px] font-semibold uppercase tracking-wide text-slate-400 mb-2.5">Template rapidi</p>
                  <div className="flex flex-col sm:flex-row sm:flex-wrap gap-2">
                    {TEMPLATE_LAVORI.filter(t => t.zona === zonaAttiva).map(t => (
                      <button
                        key={t.id}

                      subMat: carrello.filter(i=>i.kind==='materiale').reduce((s,i)=>s+i.prezzoUnitario*i.qty,0),
                      subProd: carrello.filter(i=>i.kind==='prodotto').reduce((s,i)=>s+i.prezzoUnitario*i.qty,0),
                      rincaro: rincaroValore,
                      totale,
                      rincaroMode,
                      rPct: rincaroPercent,
                      rOre: rincaroOre,
                      rTar: rincaroTariffa,
                      nextId: 'PV-' + String(maxNum2+1).padStart(4,'0'),
                    });
                  }}
                  className="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
                >
                  <Download className="w-4 h-4" />
                  PDF Interno Firma
                </button>
              </div>
              <button
                onClick={salvaPreventivo}
                className="w-full border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-semibold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2"
              >
                <Check className="w-4 h-4 text-emerald-500" />
                Salva preventivo nella lista
              </button>
              <button onClick={() => setShowPreview(false)} className="w-full text-slate-400 text-xs py-2 mt-1">
                ← Modifica
              </button>
            </div>
          </div>
        </div>
      )}

      {/* success modal */}
      {showSuccess && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6">
          <div className="absolute inset-0 bg-black/50" onClick={chiudiSuccess}></div>
          <div className="relative bg-white rounded-2xl p-6 max-w-sm w-full">
            <div className="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center mb-4">
              <Check className="w-6 h-6 text-emerald-600" />
            </div>
            <p className="text-base font-bold text-slate-900">Preventivo salvato</p>
            <p className="text-sm text-slate-500 mt-2 leading-relaxed">
              Il preventivo per <strong>{cliente?.nome}</strong> è stato salvato nella lista. Puoi scaricare i PDF dall'anteprima documento.
            </p>
            <div className="flex items-center justify-between border-t border-slate-100 mt-4 pt-4">
              <span className="text-xs font-semibold text-slate-400">Totale</span>
              <span className="text-base font-bold text-emerald-600">{fmtEuro(Math.round(totale))}</span>
            </div>
            <button onClick={chiudiSuccess} className="w-full mt-5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold py-3 rounded-xl transition-colors">
              Vai alla lista preventivi
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function MaterialiPage({ materiali, setMateriali }) {
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newUnita, setNewUnita] = useState('m');
  const [newPrezzo, setNewPrezzo] = useState('');
  const [savedFlashId, setSavedFlashId] = useState(null);

  const oggi = () => {
    const d = new Date();
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const startEdit = (m) => {
    setEditingId(m.id);
    setEditValue(String(m.prezzo).replace('.', ','));
  };

  const confirmEdit = (id) => {
    const val = parseFloat(editValue.replace(',', '.'));
    if (!isNaN(val) && val > 0) {
      setMateriali(materiali.map(m => m.id === id ? { ...m, prezzo: val, ultimoAggiornamento: oggi() } : m));
      setSavedFlashId(id);
      setTimeout(() => setSavedFlashId(null), 1800);
    }
    setEditingId(null);
  };

  const deleteMateriale = (id) => {
    setMateriali(materiali.filter(m => m.id !== id));
  };

  const addMateriale = () => {
    if (!newNome.trim()) return;
    const prezzo = parseFloat((newPrezzo || '0').replace(',', '.')) || 0;
    const newItem = {
      id: 'm' + Date.now(),
      nome: newNome.trim(),
      unita: newUnita,
      prezzo,
      ultimoAggiornamento: oggi(),
    };
    setMateriali([newItem, ...materiali]);
    setNewNome('');
    setNewUnita('m');
    setNewPrezzo('');
    setShowNewForm(false);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">

      <div className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
        <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 className="text-sm font-semibold text-slate-900">Materiali grezzi</h2>
            <p className="text-xs text-slate-400 mt-0.5">{materiali.length} voci nel listino</p>
          </div>
          <button
            onClick={() => setShowNewForm(!showNewForm)}
            className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors"
          >
            <Plus className="w-3.5 h-3.5" />
            Nuovo materiale
          </button>
        </div>

        {showNewForm && (
          <div className="px-5 py-4 bg-slate-50 border-b border-slate-100">
            <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto_auto_auto] gap-2.5 items-end">
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Nome materiale</label>
                <input
                  type="text"
                  value={newNome}
                  onChange={(e) => setNewNome(e.target.value)}
                  placeholder="Es. Tubo in rame 14mm"
                  className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Unità</label>
                <select
                  value={newUnita}
                  onChange={(e) => setNewUnita(e.target.value)}
                  className="px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                >
                  <option value="m">al metro (m)</option>
                  <option value="pz">a pezzo (pz)</option>
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo €</label>
                <input
                  type="text"
                  inputMode="decimal"
                  value={newPrezzo}
                  onChange={(e) => setNewPrezzo(e.target.value)}
                  placeholder="0,00"
                  className="w-24 px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
                />
              </div>
              <div className="flex gap-2">
                <button
                  onClick={addMateriale}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors"
                >
                  Aggiungi
                </button>
                <button
                  onClick={() => setShowNewForm(false)}
                  className="px-3 py-2 text-slate-400 hover:text-slate-600"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>
        )}

        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-100">
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Materiale</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Unità</th>
                <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Aggiornato</th>
                <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Prezzo</th>
                <th className="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {materiali.map((m) => (
                <tr key={m.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors">
                  <td className="px-5 py-3.5 font-medium text-slate-900">{m.nome}</td>
                  <td className="px-5 py-3.5 text-slate-500 font-mono text-xs">{m.unita}</td>
                  <td className="px-5 py-3.5 text-slate-400 text-xs hidden sm:table-cell">{m.ultimoAggiornamento}</td>
                  <td className="px-5 py-3.5 text-right">
                    {editingId === m.id ? (
                      <div className="flex items-center justify-end gap-1.5">
                        <span className="text-slate-400 text-xs">€</span>
                        <input
                          autoFocus
                          type="text"
                          inputMode="decimal"
                          value={editValue}
                          onChange={(e) => setEditValue(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && confirmEdit(m.id)}
                          className="w-20 px-2 py-1 text-sm text-right bg-white border border-blue-300 rounded-md outline-none focus:ring-2 focus:ring-blue-500/30"
                        />
                        <button onClick={() => confirmEdit(m.id)} className="text-emerald-600 hover:text-emerald-700">
                          <Check className="w-4 h-4" />
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => startEdit(m)}
                        className={`font-semibold transition-colors rounded-md px-2 py-1 ${
                          savedFlashId === m.id ? 'bg-emerald-50 text-emerald-700' : 'text-slate-900 hover:bg-slate-100'
                        }`}
                      >
                        {m.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €
                      </button>
                    )}
                  </td>
                  <td className="px-5 py-3.5 text-right">
                    <div className="flex items-center justify-end gap-1">
                      <button onClick={() => startEdit(m)} className="text-slate-400 hover:text-slate-600 p-1">
                        <Pencil className="w-3.5 h-3.5" />
                      </button>
                      <button onClick={() => deleteMateriale(m.id)} className="text-slate-400 hover:text-red-500 p-1">
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </td>
                </tr>
              ))}
              {materiali.length === 0 && (
                <tr>
                  <td colSpan="5" className="px-5 py-10 text-center text-sm text-slate-400">
                    Nessun materiale ancora. Aggiungine uno per iniziare il tuo listino.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* PAGINA CATALOGO PRODOTTI — finiture premium, organizzate       */

function CatalogoPage({ prodotti, setProdotti }) {
  const [activeCat, setActiveCat] = useState('Caldaie & Clima');
  const [activeSub, setActiveSub] = useState('Tutte');
  const [showNewForm, setShowNewForm] = useState(false);
  const [newNome, setNewNome] = useState('');
  const [newSub, setNewSub] = useState('');
  const [newTier, setNewTier] = useState('Standard');
  const [newPrezzo, setNewPrezzo] = useState('');
  const [importMsg, setImportMsg] = useState(null); // { tipo, testo }
  const [importing, setImporting] = useState(false);

  const sottocategorie = ['Tutte', ...new Set(prodotti.filter(p => p.categoria === activeCat).map(p => p.sottocategoria).filter(Boolean))];
  const filtered = prodotti.filter(p => p.categoria === activeCat && (activeSub === 'Tutte' || p.sottocategoria === activeSub));

  const addProdotto = () => {
    if (!newNome.trim()) return;
    const prezzo = parseFloat((newPrezzo || '0').replace(',', '.')) || 0;
    setProdotti([{ id: 'p' + Date.now(), nome: newNome.trim(), categoria: activeCat, sottocategoria: newSub.trim() || 'Generico', tier: newTier, prezzo }, ...prodotti]);
    setNewNome('');
    setNewSub('');
    setNewTier('Standard');
    setNewPrezzo('');
    setShowNewForm(false);
  };

  const deleteProdotto = (id) => setProdotti(prodotti.filter(p => p.id !== id));

  // Import listino fornitore — legge un CSV/Excel esportato dall'area riservata
  // del fornitore (Tecnomat, Deghi, IDM...) e aggiunge i prodotti al catalogo.
  // il proprietario lo fa da solo, senza dover chiamare nessuno.
  const importaCatalogo = (file) => {
    if (!file) return;
    setImporting(true);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const testo = e.target.result;
        const righe = testo.split('\n').map(r => r.trim()).filter(Boolean);
        // formato atteso: Nome,Categoria,Sottocategoria,Tier,Prezzo
        const nuovi = righe.slice(1).map((riga, idx) => {
          const cols = riga.split(',').map(c => c.trim());
          return {
            id: 'imp' + Date.now() + idx,
            nome: cols[0] || 'Prodotto importato',
            categoria: cols[1] || activeCat,
            sottocategoria: cols[2] || 'Generico',
            tier: cols[3] || 'Standard',
            prezzo: parseFloat(cols[4]) || 0,
          };
        }).filter(p => p.nome !== 'Prodotto importato' || righe.length > 1);

        if (nuovi.length > 0) {
          setProdotti(prev => [...nuovi, ...prev]);
          setImportMsg({ tipo: 'ok', testo: `${nuovi.length} prodotti importati dal listino.` });
        } else {
          setImportMsg({ tipo: 'err', testo: 'Il file non contiene righe valide. Usa il formato: Nome,Categoria,Sottocategoria,Qualità,Prezzo' });
        }
      } catch (err) {
        setImportMsg({ tipo: 'err', testo: 'Non sono riuscito a leggere il file. Controlla il formato ed riprova.' });
      }
      setImporting(false);
      setTimeout(() => setImportMsg(null), 5000);
    };
    reader.readAsText(file);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">

      {/* Aggiorna catalogo — import autonomo del listino fornitore */}
      <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-start gap-3 min-w-0">
          <div className="w-9 h-9 rounded-lg bg-blue-50 flex items-center justify-center shrink-0">
            <Download className="w-[18px] h-[18px] text-blue-600" />
          </div>
          <div className="min-w-0">
            <p className="text-sm font-semibold text-slate-900">Aggiorna catalogo dal fornitore</p>
            <p className="text-xs text-slate-400 mt-0.5">File CSV esportato dall'area riservata del fornitore</p>
          </div>
        </div>
        <label className={`shrink-0 flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2.5 rounded-lg cursor-pointer transition-colors ${importing ? 'bg-slate-100 text-slate-400' : 'bg-slate-900 hover:bg-slate-800 text-white'}`}>
          {importing ? 'Importazione...' : 'Carica listino'}
          <input
            type="file"
            accept=".csv,.txt"
            className="hidden"
            disabled={importing}
            onChange={(e) => { if (e.target.files[0]) importaCatalogo(e.target.files[0]); e.target.value = ''; }}
          />
        </label>
      </div>
      {importMsg && (
        <div className={`px-4 py-2.5 rounded-lg text-xs font-semibold ${importMsg.tipo === 'ok' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}`}>
          {importMsg.testo}
        </div>
      )}

      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex gap-1.5 bg-white border border-slate-200 rounded-xl p-1 overflow-x-auto">
          {categorieCatalogo.map((cat) => (
            <button
              key={cat}
              onClick={() => { setActiveCat(cat); setActiveSub('Tutte'); }}
              className={`px-3.5 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-colors ${
                activeCat === cat ? 'bg-slate-900 text-white' : 'text-slate-500 hover:text-slate-900'
              }`}
            >
              {cat}
            </button>
          ))}
        </div>
        <button
          onClick={() => setShowNewForm(!showNewForm)}
          className="flex items-center gap-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition-colors"
        >
          <Plus className="w-3.5 h-3.5" />
          Nuovo prodotto
        </button>
      </div>

      {/* sottocategorie della categoria attiva — filtro rapido richiesto dal cliente */}
      {sottocategorie.length > 1 && (
        <div className="flex flex-wrap gap-1.5">
          {sottocategorie.map(sub => (
            <button
              key={sub}
              onClick={() => setActiveSub(sub)}
              className={`px-3 py-1.5 rounded-full text-[11px] font-semibold transition-colors ${
                activeSub === sub ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
              }`}
            >
              {sub}
            </button>
          ))}
        </div>
      )}

      {showNewForm && (
        <div className="bg-white border border-slate-200 rounded-2xl p-4">
          <p className="text-xs font-semibold text-slate-500 mb-3">Nuovo prodotto in "{activeCat}"</p>
          <div className="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto_auto_auto] gap-2.5 items-end">
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Nome prodotto</label>
              <input
                type="text"
                value={newNome}
                onChange={(e) => setNewNome(e.target.value)}
                placeholder="Es. Caldaia Vaillant 28kW"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Sottocategoria</label>
              <input
                type="text"
                value={newSub}
                onChange={(e) => setNewSub(e.target.value)}
                placeholder="Es. Filo muro"
                className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Qualità</label>
              <select
                value={newTier}
                onChange={(e) => setNewTier(e.target.value)}
                className="px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              >
                <option>Standard</option>
                <option>Premium</option>
                <option>Lusso</option>
              </select>
            </div>
            <div>
              <label className="block text-[11px] font-medium text-slate-500 mb-1">Prezzo €</label>
              <input
                type="text"
                inputMode="decimal"
                value={newPrezzo}
                onChange={(e) => setNewPrezzo(e.target.value)}
                placeholder="0,00"
                className="w-24 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div className="flex gap-2">
              <button onClick={addProdotto} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors">
                Aggiungi
              </button>
              <button onClick={() => setShowNewForm(false)} className="px-3 py-2 text-slate-400 hover:text-slate-600">
                <X className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {filtered.map((p) => (
          <div key={p.id} className="bg-white border border-slate-200 rounded-2xl overflow-hidden group">
            <div className="h-28 bg-slate-50 flex flex-col items-center justify-center gap-1.5 relative">
              <ImagePlus className="w-5 h-5 text-slate-300" />
              <span className="text-[10.5px] font-medium text-slate-400">Foto da aggiungere</span>
              <span className={`absolute top-2 left-2 text-[10px] font-semibold px-2 py-1 rounded-full ${tierStyle[p.tier]}`}>
                {p.tier}
              </span>
              <button
                onClick={() => deleteProdotto(p.id)}
                className="absolute top-2 right-2 w-6 h-6 rounded-full bg-white/90 text-slate-400 hover:text-red-500 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
              >
                <Trash2 className="w-3 h-3" />

            <div className="p-3.5">
              {p.sottocategoria && <p className="text-[10px] font-semibold text-blue-500 uppercase tracking-wide mb-1">{p.sottocategoria}</p>}
              <p className="text-[13px] font-semibold text-slate-900 leading-snug min-h-[34px]">{p.nome}</p>
              <p className="text-base font-bold text-slate-900 mt-1.5">{fmtEuro(p.prezzo)}</p>
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <div className="sm:col-span-2 lg:col-span-3 bg-white border border-slate-200 rounded-2xl py-14 flex flex-col items-center justify-center text-center">
            <ShoppingBag className="w-7 h-7 text-slate-300 mb-2" />

        )}
      </div>
    </div>
  );

function SquadraPage({ preventivi, clienti }) {
  const lavoriAttivi = preventivi.filter(p => p.stato === 'In Attesa' || p.stato === 'Accettato');

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5">

        <div className="bg-white border border-slate-200 rounded-2xl py-16 flex flex-col items-center justify-center text-center">
          <Wrench className="w-7 h-7 text-slate-300 mb-2" />
          <p className="text-sm text-slate-400">Nessun lavoro attivo al momento.</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          {lavoriAttivi.map(p => {
            const cliente = clienti.find(c => c.id === p.clienteId);
            const zone = p.zone || [];
            const carrelloSnap = p.carrelloSnapshot || [];
            return (
              <div key={p.id} className="bg-white border border-slate-200 rounded-2xl overflow-hidden">
                <div className="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <p className="text-sm font-semibold text-slate-900">{p.cantiere}</p>
                    <p className="text-xs text-slate-400 mt-0.5">{cliente?.nome || p.cliente}</p>
                  </div>
                  <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium ${statoStyle[p.stato]}`}>{p.stato}</span>
                </div>
                <div className="p-4 space-y-3">
                  {zone.length > 0 ? (
                    zone.map(zonaId => {
                      const zonaInfo = ZONE_AMBIENTI.find(z => z.id === zonaId);
                      const vociZona = carrelloSnap.filter(i => (i.zona || 'generico') === zonaId);
                      return (
                        <div key={zonaId}>
                          <p className="text-xs font-bold text-slate-700 flex items-center gap-2 mb-1">
                            <ZonaIcon zonaId={zonaInfo?.id || zonaId} className="text-slate-500 shrink-0" size={14} />
                            {zonaInfo?.nome || zonaId}
                          </p>
                          <ul className="space-y-0.5 pl-1">
                            {vociZona.map(v => (
                              <li key={v.id} className="text-xs text-slate-500 flex items-center gap-1.5">
                                <span className="text-slate-300">•</span>
                                {v.nome} <span className="text-slate-400 font-mono">({v.qty})</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      );
                    })
                  ) : (
                    <p className="text-xs text-slate-400">Nessuna zona specificata per questo preventivo.</p>
                  )}
                  {p.nFoto > 0 && (
                    <p className="text-[11px] text-slate-400 flex items-center gap-1.5 pt-1 border-t border-slate-50">
                      <ImagePlus className="w-3 h-3" /> {p.nFoto} foto cantiere archiviate
                    </p>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}



const pageConfig = {
  dashboard: { title: 'Dashboard', subtitle: null },
  preventivi: { title: 'Preventivi', subtitle: null },
  clienti: { title: 'Clienti', subtitle: null },
  materiali: { title: 'Materiali', subtitle: null },
  catalogo: { title: 'Catalogo', subtitle: null },
  squadra: { title: 'Lavori Squadra', subtitle: null },
};

function App() {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  // stato centrale: tutta l'app legge e scrive da qui
  const [clienti, setClienti] = useState(clientiIniziali);
  const [materiali, setMateriali] = useState(materialiIniziali);
  const [prodotti, setProdotti] = useState(catalogoIniziale);
  const [preventivi, setPreventivi] = useState(preventiviRecenti);
  const [presetClienteId, setPresetClienteId] = useState(null);

  if (!isLoggedIn) {
    return <LoginPage onLogin={() => setIsLoggedIn(true)} />;
  }

  const { title, subtitle } = pageConfig[currentPage];

  const handleNuovoPreventivo = (clienteId) => {
    setPresetClienteId(clienteId);
    setCurrentPage('preventivi');
  };

  const goToPage = (page) => {
    setCurrentPage(page);
    setMobileNavOpen(false);
  };

  return (
    <div className="min-h-screen bg-slate-50 flex">
      <Sidebar
        currentPage={currentPage}
        setCurrentPage={goToPage}
        onLogout={() => setIsLoggedIn(false)}
        mobileOpen={mobileNavOpen}
        onMobileClose={() => setMobileNavOpen(false)}
      />

      <div className="flex-1 min-w-0 pb-[calc(4.5rem+env(safe-area-inset-bottom))] lg:pb-0">
        <TopBar title={title} subtitle={subtitle} onMenuClick={() => setMobileNavOpen(true)} />

        {currentPage === 'dashboard' && (
          <DashboardPage preventivi={preventivi} clienti={clienti} onVediTutti={() => setCurrentPage('preventivi')} />
        )}
        {currentPage === 'preventivi' && (
          <PreventiviPage
            clienti={clienti}
            setClienti={setClienti}
            preventivi={preventivi}
            setPreventivi={setPreventivi}
            materiali={materiali}
            setMateriali={setMateriali}
            prodotti={prodotti}
            presetClienteId={presetClienteId}
            onConsumePreset={() => setPresetClienteId(null)}
          />
        )}
        {currentPage === 'clienti' && (
          <ClientiPage
            clienti={clienti}
            setClienti={setClienti}
            preventivi={preventivi}
            onNuovoPreventivo={handleNuovoPreventivo}
          />
        )}
        {currentPage === 'materiali' && <MaterialiPage materiali={materiali} setMateriali={setMateriali} />}
        {currentPage === 'catalogo' && <CatalogoPage prodotti={prodotti} setProdotti={setProdotti} />}
        {currentPage === 'squadra' && <SquadraPage preventivi={preventivi} clienti={clienti} />}
      </div>

      <MobileBottomNav currentPage={currentPage} setCurrentPage={goToPage} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
