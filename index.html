function PreventiviPage({ clienti, setClienti, clientiLoading, preventivi, setPreventivi, preventiviLoading, materiali, setMateriali, prodotti, presetClienteId, onConsumePreset, presetDettaglioId, onConsumePresetDettaglio }) {
  const [mode, setMode] = useState('lista'); // 'lista' | 'nuovo' | 'dettaglio'
  const [clienteId, setClienteId] = useState(null);
  const [statoEditId, setStatoEditId] = useState(null); // id preventivo in cambio stato
  const [dettaglioId, setDettaglioId] = useState(null);
  const [modificaId, setModificaId] = useState(null); // numero preventivo in modifica (null = sto creandone uno nuovo)
  const [modificaDbId, setModificaDbId] = useState(null); // uuid reale dello stesso preventivo, per collegare le foto
  const [statoEditDettaglio, setStatoEditDettaglio] = useState(false);
  const [caricandoFoto, setCaricandoFoto] = useState(false);
  const [clienteSearch, setClienteSearch] = useState('');

  // helper per aggiornare clienti dal form inline
  const setClientiEsterni = setClienti;
  const [carrello, setCarrello] = useState([]); // { id, nome, meta, prezzoUnitario, qty, kind }
  const [showNuovoMateriale, setShowNuovoMateriale] = useState(false);
  const [nmNome, setNmNome] = useState('');
  const [nmUnita, setNmUnita] = useState('m');
  const [nmPrezzo, setNmPrezzo] = useState('');
  const [nmZona, setNmZona] = useState('');
  const [nmSalvando, setNmSalvando] = useState(false);
  const [nmErrore, setNmErrore] = useState('');
  const [rincaroMode, setRincaroMode] = useState('percent');
  const [rincaroPercent, setRincaroPercent] = useState('10');
  const [rincaroOre, setRincaroOre] = useState('8');
  const [rincaroTariffa, setRincaroTariffa] = useState('35');
  const [activeCat, setActiveCat] = useState(categorieCatalogo[0]);
  const [savedFlashId, setSavedFlashId] = useState(null);
  const [showPreview, setShowPreview] = useState(false);
  const [previewView, setPreviewView] = useState('cliente'); // 'cliente' | 'interno'
  const [showSuccess, setShowSuccess] = useState(false);
  const [zonaAttiva, setZonaAttiva] = useState('generico');
  const [fotoCantiere, setFotoCantiere] = useState([]); // { id, url, tipo: 'prima'|'dopo', zona }
  const [salvandoPreventivo, setSalvandoPreventivo] = useState(false);
  const [errorePreventivo, setErrorePreventivo] = useState('');
  const [fotoDettaglio, setFotoDettaglio] = useState([]);
  const [diciture, setDiciture] = useState({}); // { [itemId]: { categoria, testo } } — Fase 4

  const setCategoriaVoce = (itemId, categoria) => setDiciture(prev => ({ ...prev, [itemId]: { ...prev[itemId], categoria } }));
  const setTestoVoce = (itemId, testo) => setDiciture(prev => ({ ...prev, [itemId]: { ...prev[itemId], testo } }));

  // carica le foto del preventivo aperto in dettaglio
  React.useEffect(() => {
    if (mode !== 'dettaglio' || !dettaglioId) { setFotoDettaglio([]); return; }
    const p = preventivi.find(pv => pv.id === dettaglioId);
    if (!p || !p.dbId) { setFotoDettaglio([]); return; }
    let annullato = false;
    sb.from('foto').select('*').eq('preventivo_id', p.dbId).order('creato_il', { ascending: true }).then(({ data, error }) => {
      if (annullato || error || !data) return;
      setFotoDettaglio(data.map(fotoFromRow));
    });
    return () => { annullato = true; };
  }, [mode, dettaglioId]);

  // apre direttamente il flusso "nuovo" se arriviamo da una scheda cliente
  React.useEffect(() => {
    if (presetClienteId) {
      setClienteId(presetClienteId);
      setCarrello([]);
      setMode('nuovo');
      onConsumePreset();
    }
  }, [presetClienteId]);

  // apre direttamente il dettaglio se arriviamo dallo storico di un cliente
  React.useEffect(() => {
    if (presetDettaglioId) {
      setDettaglioId(presetDettaglioId);
      setMode('dettaglio');
      onConsumePresetDettaglio();
    }
  }, [presetDettaglioId]);

  const cliente = clienti.find(c => c.id === clienteId);

  const subtotaleMateriali = carrello.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const subtotaleProdotti = carrello.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
  const rincaroValore = rincaroMode === 'percent'
    ? subtotaleMateriali * ((parseFloat(rincaroPercent) || 0) / 100)
    : (parseFloat(rincaroOre) || 0) * (parseFloat(rincaroTariffa) || 0);
  const totale = subtotaleMateriali + subtotaleProdotti + rincaroValore;

  const startNuovo = () => {
    setModificaId(null);
    setModificaDbId(null);
    setClienteId(null);
    setCarrello([]);
    setRincaroMode('percent');
    setRincaroPercent('10');
    setRincaroOre('8');
    setRincaroTariffa('35');
    setZonaAttiva('generico');
    setFotoCantiere([]);
    setClienteSearch('');
    setDiciture({});
    setMode('nuovo');
  };

  // apre un preventivo esistente nello stesso costruttore usato per crearne
  // uno nuovo, così si possono cambiare voci/materiali/zone, e ricarica le
  // foto già salvate per questo preventivo
  const iniziaModifica = async (p) => {
    setModificaId(p.id);
    setModificaDbId(p.dbId);
    setClienteId(p.clienteId);
    setCarrello(p.carrelloSnapshot || []);
    setZonaAttiva((p.zone && p.zone[0]) || 'generico');
    setFotoCantiere([]);
    setDiciture(p.diciture || {});
    setMode('nuovo');
    if (p.dbId) {
      const { data, error } = await sb.from('foto').select('*').eq('preventivo_id', p.dbId).order('creato_il', { ascending: true });
      if (!error && data) setFotoCantiere(data.map(fotoFromRow));
    }
  };

  const aggiornaPrezzoMateriale = async (matId, valoreStr) => {
    const valore = parseFloat(valoreStr.replace(',', '.'));
    if (!isNaN(valore) && valore > 0) {
      const { error } = await sb.from('materiali')
        .update({ prezzo: valore, ultimo_aggiornamento: new Date().toISOString() })
        .eq('id', matId);
      if (error) {
        mostraToast('Errore nel salvare il prezzo: ' + error.message);
        return;
      }
    }
    setMateriali(materiali.map(m => m.id === matId ? { ...m, prezzo: isNaN(valore) ? m.prezzo : valore } : m));
    if (!isNaN(valore) && valore > 0) {
      const mat = materiali.find(m => m.id === matId);
      setCarrello(prev => {
        const exists = prev.find(i => i.id === matId);
        const qty = exists ? exists.qty : 1;
        const nuovaVoce = { id: matId, nome: mat.nome, meta: `${qty} ${mat.unita} × ${valore.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`, prezzoUnitario: valore, qty, kind: 'materiale', zona: exists?.zona || zonaAttiva };
        if (exists) return prev.map(i => i.id === matId ? nuovaVoce : i);
        return [...prev, nuovaVoce];
      });
      setSavedFlashId(matId);
      setTimeout(() => setSavedFlashId(null), 1500);
    } else if (valoreStr === '') {
      setCarrello(prev => prev.filter(i => i.id !== matId));
    }
  };

  const aggiornaQtyMateriale = (matId, qty) => {
    const mat = materiali.find(m => m.id === matId);
    if (!mat) return;
    setCarrello(prev => {
      const exists = prev.find(i => i.id === matId);
      const prezzoUnitario = exists ? exists.prezzoUnitario : mat.prezzo;
      const meta = `${qty} ${mat.unita} × ${prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`;
      if (exists) {
        return prev.map(i => i.id === matId ? { ...i, qty, meta } : i);
      }
      if (qty <= 0) return prev;
      return [...prev, { id: mat.id, nome: mat.nome, meta, prezzoUnitario, qty, kind: 'materiale', zona: zonaAttiva }];
    });
  };

  // aggiunge un materiale mai visto prima: lo crea nel listino Supabase e
  // lo mette subito nel carrello di questo preventivo
  const aggiungiMaterialeAlVolo = async () => {
    if (!nmNome.trim()) return;
    setNmSalvando(true);
    setNmErrore('');
    const prezzo = parseFloat((nmPrezzo || '0').replace(',', '.')) || 0;
    const { data, error } = await sb.from('materiali')
      .insert(materialeToRow({ nome: nmNome.trim(), unita: nmUnita, prezzo, zona: nmZona }))
      .select().single();
    setNmSalvando(false);
    if (error) {
      setNmErrore('Errore nel salvare il materiale: ' + error.message);
      return;
    }
    const nuovoMat = materialeFromRow(data);
    setMateriali(prev => [...prev, nuovoMat]);
    setCarrello(prev => [...prev, {
      id: nuovoMat.id, nome: nuovoMat.nome,
      meta: `1 ${nuovoMat.unita} × ${nuovoMat.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`,
      prezzoUnitario: nuovoMat.prezzo, qty: 1, kind: 'materiale', zona: zonaAttiva,
    }]);
    setNmNome('');
    setNmUnita('m');
    setNmPrezzo('');
    setNmZona('');
    setShowNuovoMateriale(false);
  };

  const toggleProdotto = (p) => {
    const exists = carrello.find(i => i.id === p.id);
    if (exists) {
      setCarrello(carrello.filter(i => i.id !== p.id));
    } else {
      setCarrello([...carrello, { id: p.id, nome: p.nome, meta: p.tier, prezzoUnitario: p.prezzo, qty: 1, kind: 'prodotto', zona: zonaAttiva, tipoInstallazione: 'nuova' }]);
    }
  };

  // P3: quantità multiple per i prodotti già nel carrello
  const aggiornaQtyProdotto = (id, qty) => {
    setCarrello(prev => {
      if (qty <= 0) return prev.filter(i => i.id !== id);
      return prev.map(i => i.id === id ? { ...i, qty } : i);
    });
  };

  // nuova installazione o sostituzione di un prodotto esistente — cambia la
  // descrizione auto-generata nel documento cliente (smontaggio del vecchio)
  const impostaTipoInstallazione = (id, tipo) => {
    setCarrello(prev => prev.map(i => i.id === id ? { ...i, tipoInstallazione: tipo } : i));
  };

  // Applica un template di lavoro — aggiunge automaticamente i materiali tipici,
  // così non si devono cercarli uno per uno per i lavori più comuni
  const applicaTemplate = async (template) => {
    setZonaAttiva(template.zona);
    for (const tm of template.materiali) {
      const matEsistente = materiali.find(m => m.nome === tm.nome);
      let matId = matEsistente?.id;
      if (!matEsistente) {
        const { data, error } = await sb.from('materiali')
          .insert(materialeToRow({ nome: tm.nome, unita: tm.unita, prezzo: tm.prezzo }))
          .select().single();
        if (error) {
          console.error('Errore nel salvare il materiale dal template:', error);
          continue;
        }
        const nuovoMat = materialeFromRow(data);
        setMateriali(prevMat => [...prevMat, nuovoMat]);
        matId = nuovoMat.id;
      }
      setCarrello(prev => {
        const exists = prev.find(i => i.id === matId);
        if (exists) {
          // già in carrello (da un altro template o aggiunto a mano): sommiamo
          // la quantità del template invece di ignorarla, altrimenti il
          // materiale resta con una quantità insufficiente per il lavoro
          const nuovaQty = exists.qty + tm.qty;
          return prev.map(i => i.id === matId
            ? { ...i, qty: nuovaQty, meta: `${nuovaQty} ${tm.unita} × ${i.prezzoUnitario.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €` }
            : i);
        }
        return [...prev, {
          id: matId, nome: tm.nome,
          meta: `${tm.qty} ${tm.unita} × ${tm.prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2 })} €`,
          prezzoUnitario: tm.prezzo, qty: tm.qty, kind: 'materiale', zona: template.zona,
        }];
      });
    }
    if (template.prodottoSuggerito) {
      const prod = prodotti.find(p => p.nome === template.prodottoSuggerito);
      if (prod) {
        setCarrello(prev => {
          if (prev.find(i => i.id === prod.id)) return prev;
          return [...prev, { id: prod.id, nome: prod.nome, meta: prod.tier, prezzoUnitario: prod.prezzo, qty: 1, kind: 'prodotto', zona: template.zona }];
        });
      }
    }
  };

  // Gestione foto cantiere — ogni foto viene compressa e caricata subito su
  // Supabase Storage, con una riga in "foto" (senza preventivo_id finché il
  // preventivo non viene salvato: si collega dopo, in salvaPreventivo).
  // L'app richiede almeno 2 foto prima di poter salvare un preventivo nuovo.
  const gestisciFoto = async (fileList, tipo) => {
    setCaricandoFoto(true);
    for (const file of Array.from(fileList)) {
      let blob;
      try {
        blob = await comprimiImmagine(file, 1280, 0.6);
      } catch (err) {
        mostraToast('Errore nel comprimere la foto: ' + err.message);
        continue;
      }
      try {
        if (!navigator.onLine) throw new Error('offline');
        const cartella = cliente?.id || 'senza-cliente';
        const path = `${cartella}/${Date.now()}-${tipo}.jpg`;
        const { error: uploadError } = await sb.storage.from('cantiere-foto').upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;
        const rigaFoto = { preventivoId: modificaId ? modificaDbId : null, clienteId: cliente?.id || null, zona: zonaAttiva, tipo, storagePath: path };
        const { data, error } = await sb.from('foto').insert(fotoToRow(rigaFoto)).select().single();
        if (error) throw error;
        setFotoCantiere(prev => [...prev, fotoFromRow(data)]);
      } catch (err) {
        // niente rete: la foto resta comunque visibile e conta per il
        // minimo di 2 richieste — si carica da sola alla riconnessione
        const localId = 'offline-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        setFotoCantiere(prev => [...prev, { id: localId, url: URL.createObjectURL(blob), tipo, zona: zonaAttiva, pending: true, _blob: blob }]);
      }
    }
    setCaricandoFoto(false);
  };

  const rimuoviFoto = async (id) => {
    const f = fotoCantiere.find(x => x.id === id);
    if (!f) return;
    setFotoCantiere(prev => prev.filter(x => x.id !== id));
    if (f.pending) return;
    if (f.storagePath) sb.storage.from('cantiere-foto').remove([f.storagePath]).catch(() => {});
    sb.from('foto').delete().eq('id', id).then(({ error }) => {
      if (error) console.error('Errore nel rimuovere la foto:', error);
    });
  };

  const rimuoviVoce = (id) => setCarrello(carrello.filter(i => i.id !== id));

  const cambiaStato = async (id, nuovoStato) => {
    const { error } = await sb.from('preventivi').update({ stato: nuovoStato }).eq('numero', id);
    if (error) {
      mostraToast('Errore nel salvare lo stato: ' + error.message);
      return;
    }
    setPreventivi(preventivi.map(p => p.id === id ? { ...p, stato: nuovoStato } : p));
    setStatoEditId(null);
  };

  const maxNum = Math.max(...preventivi.map(p => parseInt(p.id.replace('PV-', '')) || 0), 148);
  const numeroDocumento = 'PV-' + String(maxNum + 1).padStart(4, '0');
  const dataDocumento = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const salvaPreventivo = async () => {
    if (!cliente || carrello.length === 0) return;
    setSalvandoPreventivo(true);
    setErrorePreventivo('');
    const zoneCoinvolte = [...new Set(carrello.map(i => i.zona || 'generico'))];
    // foto scattate mentre non c'era rete: sono già visibili in fotoCantiere
    // ma esistono solo come blob locale, vanno accodate insieme al preventivo
    const fotoPendenti = fotoCantiere.filter(f => f.pending).map(f => ({ blob: f._blob, tipo: f.tipo, zona: f.zona }));

    if (modificaId) {
      const payload = {
        clienteId: cliente.id,
        cliente: cliente.nome,
        cantiere: cliente.indirizzo.split(',').pop().trim(),
        importo: Math.round(totale),
        importoManodopera: Math.round(rincaroValore),
        carrelloSnapshot: carrello,
        diciture: diciture,
      };
      try {
        if (!navigator.onLine) throw new Error('offline');
        const { error } = await sb.from('preventivi').update(preventivoToRow(payload)).eq('numero', modificaId);
        if (error) throw error;
        const fotoCaricate = fotoCantiere.filter(f => !f.pending);
        if (fotoCaricate.length > 0) {
          sb.from('foto').update({ preventivo_id: modificaDbId }).in('id', fotoCaricate.map(f => f.id))
            .then(({ error: fotoError }) => { if (fotoError) console.error('Errore nel collegare le foto:', fotoError); });
        }
        if (fotoPendenti.length > 0) {
          await accodaOffline('preventivo_foto', { preventivoId: modificaDbId, clienteId: cliente.id, foto: fotoPendenti });
        }
        setPreventivi(preventivi.map(p => p.id === modificaId ? { ...p, ...payload, id: modificaId, zone: zoneCoinvolte, nFoto: fotoCantiere.length } : p));
      } catch (err) {
        // niente rete: si accoda tutto il preventivo e si mostra comunque
        // il salvataggio come riuscito, così Denis può continuare a lavorare
        await accodaOffline('preventivo', { modificaId, modificaDbId, payload, fotoPendenti });
        setPreventivi(preventivi.map(p => p.id === modificaId ? { ...p, ...payload, id: modificaId, zone: zoneCoinvolte, nFoto: fotoCantiere.length, pending: true } : p));
      }
      setSalvandoPreventivo(false);
      setShowPreview(false);
      setShowSuccess(true);
      return;
    }

    const payload = {
      id: numeroDocumento,
      clienteId: cliente.id,
      cliente: cliente.nome,
      cantiere: cliente.indirizzo.split(',').pop().trim(),
      dataIso: new Date().toISOString().slice(0, 10),
      importo: Math.round(totale),
      importoManodopera: Math.round(rincaroValore),
      diciture: diciture,
      stato: 'In Attesa',
      carrelloSnapshot: carrello,
    };
    try {
      if (!navigator.onLine) throw new Error('offline');
      const { data, error } = await sb.from('preventivi').insert(preventivoToRow(payload)).select().single();
      if (error) throw error;
      const fotoCaricate = fotoCantiere.filter(f => !f.pending);
      if (fotoCaricate.length > 0) {
        sb.from('foto').update({ preventivo_id: data.id }).in('id', fotoCaricate.map(f => f.id))
          .then(({ error: fotoError }) => { if (fotoError) console.error('Errore nel collegare le foto:', fotoError); });
      }
      if (fotoPendenti.length > 0) {
        await accodaOffline('preventivo_foto', { preventivoId: data.id, clienteId: cliente.id, foto: fotoPendenti });
      }
      const nuovo = { ...preventivoFromRow(data), zone: zoneCoinvolte, nFoto: fotoCantiere.length };
      setPreventivi([nuovo, ...preventivi]);
    } catch (err) {
      await accodaOffline('preventivo', { modificaId: null, modificaDbId: null, payload, fotoPendenti });
      const nuovo = { ...payload, zone: zoneCoinvolte, nFoto: fotoCantiere.length, pending: true };
      setPreventivi([nuovo, ...preventivi]);
    }
    setSalvandoPreventivo(false);
    setShowPreview(false);
    setShowSuccess(true);
  };

  const chiudiSuccess = () => {
    setShowSuccess(false);
    setModificaId(null);
    setModificaDbId(null);
    setMode('lista');
  };

  /* ---- vista lista ---- */
  if (mode === 'lista') {
    // P12: lavori attivi ordinati per priorità: i Finito escono dalla lista
    // principale e restano visibili solo nello storico del cliente
    const preventiviAttivi = ordinaPerPriorita(preventivi.filter(p => p.stato !== 'Finito'));
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 relative">
        <div className="hidden lg:flex items-center justify-end">
          <button
            onClick={startNuovo}
            className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors"
          >
            <Plus className="w-4 h-4" />
            Nuovo Preventivo
          </button>
        </div>

        <div className="app-card overflow-hidden">
          <PreventivoMobileList
            items={preventiviAttivi}
            onSelect={(p) => { setDettaglioId(p.id); setMode('dettaglio'); }}
          />

          <div className="hidden md:block overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-slate-100">
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">N. Documento</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Cliente</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden md:table-cell">Cantiere</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3 hidden sm:table-cell">Data</th>
                  <th className="text-right font-medium text-slate-500 text-xs px-5 py-3">Importo</th>
                  <th className="text-left font-medium text-slate-500 text-xs px-5 py-3">Stato</th>
                </tr>
              </thead>
              <tbody>
                {preventiviAttivi.map((p) => (
                  <tr
                    key={p.id}
                    onClick={() => { setDettaglioId(p.id); setMode('dettaglio'); }}
                    className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 transition-colors cursor-pointer"
                  >
                    <td className="px-5 py-3.5 font-mono text-xs text-slate-500">{p.id}</td>
                    <td className="px-5 py-3.5 font-medium text-slate-900">{p.cliente}</td>
                    <td className="px-5 py-3.5 text-slate-500 hidden md:table-cell">{p.cantiere}</td>
                    <td className="px-5 py-3.5 text-slate-500 hidden sm:table-cell">{p.data}</td>
                    <td className="px-5 py-3.5 text-right font-semibold text-slate-900">{fmtEuro(p.importo)}</td>
                    <td className="px-5 py-3.5" onClick={(e) => e.stopPropagation()}>
                      {statoEditId === p.id ? (
                        <div className="flex items-center gap-1 flex-wrap">
                          {['In Corso', 'Accettato', 'Inviato', 'In Attesa', 'Finito', 'Rifiutato'].map(s => (
                            <button
                              key={s}
                              onClick={() => cambiaStato(p.id, s)}
                              className={`px-2 py-1 rounded-full text-[10px] font-semibold border transition-opacity hover:opacity-80 ${statoStyle[s] || 'bg-red-50 text-red-600 ring-1 ring-red-400/30'}`}
                            >
                              {s}
                            </button>
                          ))}
                          <button onClick={() => setStatoEditId(null)} className="text-slate-400 hover:text-slate-600 ml-1">
                            <X className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ) : (
                        <button
                          onClick={() => setStatoEditId(p.id)}
                          className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium hover:opacity-75 transition-opacity ${statoStyle[p.stato] || 'bg-red-50 text-red-600 ring-1 ring-red-400/30'}`}
                        >
                          {p.stato}
                          <Pencil className="w-2.5 h-2.5 opacity-60" />
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
                {preventiviAttivi.length === 0 && (
                  <tr><td colSpan="6" className="px-5 py-10 text-center text-sm text-slate-400">
                    {preventiviLoading ? 'Caricamento preventivi...' : 'Nessun preventivo attivo. I preventivi Finito restano nello storico del cliente.'}
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>

        <button
          type="button"
          onClick={startNuovo}
          className="lg:hidden fixed right-4 z-30 w-14 h-14 rounded-full bg-blue-600 text-white shadow-xl shadow-blue-600/35 flex items-center justify-center active:scale-95 transition-transform bottom-[calc(5.25rem+env(safe-area-inset-bottom))]"
          aria-label="Nuovo preventivo"
        >
          <Plus className="w-6 h-6" />
        </button>
      </div>
    );
  }

  /* ---- vista dettaglio preventivo esistente ---- */
  if (mode === 'dettaglio') {
    const p = preventivi.find(pv => pv.id === dettaglioId);
    const clienteDett = p ? clienti.find(c => c.id === p.clienteId) : null;
    const carrelloDett = p?.carrelloSnapshot || [];
    const rincaroDett = p?.importo && carrelloDett.length
      ? p.importo - carrelloDett.reduce((s, i) => s + i.prezzoUnitario * i.qty, 0)
      : 0;
    if (!p) { setMode('lista'); return null; }
    return (
      <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-5 max-w-3xl">
        <div className="flex items-center justify-between">
          <button onClick={() => { setStatoEditDettaglio(false); setMode('lista'); }} className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900">
            <ArrowLeft className="w-3.5 h-3.5" />
            Torna ai preventivi
          </button>
          <button
            onClick={() => iniziaModifica(p)}
            className="flex items-center gap-1.5 text-xs font-semibold text-blue-600 hover:text-blue-800"
          >
            <Pencil className="w-3.5 h-3.5" />
            Modifica preventivo
          </button>
        </div>

        <div className="app-card px-6 py-5 flex items-center justify-between flex-wrap gap-3">
          <div>
            <p className="font-mono text-xs text-slate-400">{p.id}</p>
            <p className="text-lg font-bold text-slate-900 mt-0.5">{clienteDett?.nome || p.cliente}</p>
            <p className="text-sm text-slate-500 mt-0.5">{clienteDett?.indirizzo || p.cantiere} · {p.data}</p>
          </div>
          <div className="text-right">
            <p className="text-2xl font-bold text-slate-900">{fmtEuro(p.importo)}</p>
            {statoEditDettaglio ? (
              <div className="flex items-center gap-1 flex-wrap justify-end mt-1.5 max-w-[220px]">
                {['In Corso', 'Accettato', 'Inviato', 'In Attesa', 'Finito', 'Rifiutato'].map(s => (
                  <button
                    key={s}
                    onClick={() => { cambiaStato(p.id, s); setStatoEditDettaglio(false); }}
                    className={`px-2 py-1 rounded-full text-[10px] font-semibold transition-opacity hover:opacity-80 ${statoStyle[s]}`}
                  >
                    {s}
                  </button>
                ))}
                <button onClick={() => setStatoEditDettaglio(false)} className="text-slate-400 hover:text-slate-600 ml-1">
                  <X className="w-3.5 h-3.5" />
                </button>
              </div>
            ) : (
              <button
                onClick={() => setStatoEditDettaglio(true)}
                className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium mt-1 hover:opacity-75 transition-opacity ${statoStyle[p.stato] || 'bg-red-50 text-red-600'}`}
              >
                {p.stato}
                <Pencil className="w-2.5 h-2.5 opacity-60" />
              </button>
            )}
          </div>
        </div>

        {(p.zone || []).length > 0 && (
          <div className="app-card overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <p className="text-sm font-semibold text-slate-900">Lavorazioni per zona</p>
            </div>
            <div className="p-5 space-y-4">
              {p.zone.map(zonaId => {
                const zonaInfo = ZONE_AMBIENTI.find(z => z.id === zonaId);
                const vociZona = carrelloDett.filter(i => (i.zona || 'generico') === zonaId);
                return (
                  <div key={zonaId}>
                    <p className="text-sm font-bold text-slate-800 flex items-center gap-2 mb-1.5">
                      <ZonaIcon zonaId={zonaInfo?.id || zonaId} className="text-slate-500 shrink-0" size={16} />
                      {zonaInfo?.nome || zonaId}
                    </p>
                    <ul className="space-y-1">
                      {vociZona.map(v => (
                        <li key={v.id} className="text-sm text-slate-600 flex items-center justify-between">
                          <span>{v.nome} <span className="text-slate-400 font-mono text-xs">({v.meta})</span></span>
                          <span className="font-semibold text-slate-900">{fmtEuro(Math.round(v.prezzoUnitario * v.qty))}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {fotoDettaglio.length > 0 && (
          <div className="app-card overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <p className="text-sm font-semibold text-slate-900">Foto cantiere ({fotoDettaglio.length})</p>
            </div>
            <div className="p-5 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
              {fotoDettaglio.map(f => (
                <div key={f.id} className="relative aspect-square rounded-lg overflow-hidden border border-slate-200">
                  <img src={f.url} alt="" className="w-full h-full object-cover" />
                  <span className={`absolute bottom-0 left-0 right-0 text-[9px] font-bold text-center py-0.5 text-white ${f.tipo === 'prima' ? 'bg-amber-500/90' : 'bg-emerald-500/90'}`}>
                    {f.tipo === 'prima' ? 'PRIMA' : 'DOPO'}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="flex flex-col sm:flex-row gap-2.5">
          <button
            onClick={async () => {
              if (!clienteDett) return;
              await generaPDFCliente({ cliente: clienteDett, carrello: carrelloDett, diciture: p.diciture || {}, totale: p.importo, nextId: p.id, logoB64: LOGO_BASE64 });
            }}
            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
          >
            <Download className="w-4 h-4" />
            PDF per il Cliente
          </button>
          <button
            onClick={async () => {
              if (!clienteDett) return;
              const subMat = carrelloDett.filter(i => i.kind === 'materiale').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
              const subProd = carrelloDett.filter(i => i.kind === 'prodotto').reduce((s, i) => s + i.prezzoUnitario * i.qty, 0);
              await generaPDFInterno({ cliente: clienteDett, carrello: carrelloDett, subMat, subProd, rincaro: rincaroDett, totale: p.importo, rincaroMode: 'percent', rPct: '10', rOre: '8', rTar: '35', nextId: p.id });
            }}
            className="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
          >
            <Download className="w-4 h-4" />
            PDF Interno
          </button>
        </div>

        <GoogleCalendarButton
          titolo={`${clienteDett?.nome || p.cliente} — ${p.cantiere || 'Sopralluogo'}`}
          luogo={clienteDett?.gpsMapsUrl ? `${clienteDett.indirizzo} (${clienteDett.gpsMapsUrl})` : (clienteDett?.indirizzo || p.cantiere)}
          descrizione={`Preventivo: ${p.id}${clienteDett?.telefono ? `\nTelefono: ${clienteDett.telefono}` : ''}`}
        />
      </div>
    );
  }

  /* ---- vista creazione/modifica preventivo ---- */
  return (
    <div className="px-4 sm:px-6 lg:px-8 py-4 sm:py-6 pb-4">
      <button onClick={() => { setModificaId(null); setModificaDbId(null); setMode('lista'); }} className="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 mb-5">
        <ArrowLeft className="w-3.5 h-3.5" />
        Torna ai preventivi
      </button>
      {modificaId && (
        <p className="text-xs font-semibold text-blue-600 -mt-3 mb-4">Stai modificando {modificaId}</p>
      )}

      {!cliente ? (
        <div className="max-w-lg space-y-4">
          {/* Selezione cliente esistente */}
          <div className="app-card p-6">

              {previewView === 'cliente' && (

                  <div className="px-6 pb-5 space-y-4">
                    {raggruppaPerCategoria(carrello, diciture).map(gruppo => (

                          {gruppo.righe.map(({ item, testo }) => (

                                  className="flex-1 bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5 text-[11.5px] text-slate-700 outline-none focus:ring-2 focus:ring-blue-500/30 resize-none"
                                />

                              <select

                    {carrello.length === 0 && (
                      <p className="text-sm text-slate-400 text-center py-4">Nessuna voce ancora aggiunta.</p>
                    )}
                    {fotoCantiere.length > 0 && (
                      <div className="pt-2 border-t border-slate-100">
                        <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">Documentazione fotografica ({fotoCantiere.length})</p>
                        <div className="grid grid-cols-6 gap-1.5">
                          {fotoCantiere.slice(0, 6).map(f => (
                            <div key={f.id} className="aspect-square rounded-md overflow-hidden border border-slate-100">

                            </div>
                          ))}

                      </div>
                    )}
                  </div>

                  <div className="px-6 pb-2">
                    <p className="text-[10px] font-semibold text-slate-400 text-center uppercase tracking-wide">IVA non esposta</p>

                  <div className="px-6 pb-5">
                    <div className="bg-[#10133a] text-white rounded-xl px-5 py-4 flex items-center justify-between">
                      <span className="text-sm font-semibold">Totale</span>
                      <span className="text-2xl font-extrabold">{fmtEuro(Math.round(totale))}</span>
                    </div>
                    <p className="text-[10px] font-semibold text-slate-500 text-center mt-2 uppercase tracking-wide">Il totale comprende materiale e manodopera</p>
                  </div>

                  <div className="bg-[#10133a] px-6 py-3">
                    <p className="text-[9.5px] font-semibold text-center leading-relaxed uppercase tracking-wide" style={{ color: '#d4af5a' }}>
                      Preventivo valido per 10 giorni dalla data di emissione, a causa di variazioni dei costi del materiale.
                    </p>
                  </div>
                </div>
              )}
            </div>

            <div className="px-5 py-4 border-t border-slate-100 shrink-0">
              <div className="flex gap-2.5 mb-2.5">
                {/* PDF per il Cliente */}
                <button
                  onClick={async () => {
                    await generaPDFCliente({
                      cliente,
                      carrello,
                      diciture,
                      totale,
                      nextId: modificaId || numeroDocumento,
                      logoB64: LOGO_BASE64,

                  className="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
                >

                </button>
                {/* PDF Interno Firma */}
                <button
                  onClick={async () => {
                    await generaPDFInterno({
                      cliente,
                      carrello,
                      subMat: carrello.filter(i=>i.kind==='materiale').reduce((s,i)=>s+i.prezzoUnitario*i.qty,0),
                      subProd: carrello.filter(i=>i.kind==='prodotto').reduce((s,i)=>s+i.prezzoUnitario*i.qty,0),
                      rincaro: rincaroValore,
                      totale,
                      rincaroMode,
                      rPct: rincaroPercent,
                      rOre: rincaroOre,
                      rTar: rincaroTariffa,

              </button>
              {errorePreventivo && <p className="text-[11px] text-red-500 text-center">{errorePreventivo}</p>}
              <button onClick={() => setShowPreview(false)} className="w-full text-slate-400 text-xs py-2 mt-1">

      {/* success modal */}
      {showSuccess && (

/* PAGINA MATERIALI — listino personale, cresce nel tempo         */
